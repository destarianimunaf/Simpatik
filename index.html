  /* ============================== UANG MAKAN (SUB PENGGAJIAN) ============================== */
  function UangMakan({ pegawai }) {
    const [periode, setPeriode] = useState(bulanIniYYYYMM());
    const [semua, setSemua] = useState(() => muatUangMakan());
    const [query, setQuery] = useState('');
    const fileInputRef = useRef(null);

    const dataPeriode = semua[periode] || {};
    // Kompatibel dengan data lama (totalHariKerja sempat tersimpan per-baris) sebagai nilai awal.
    const nilaiLamaPertama = Object.values(dataPeriode.entries || dataPeriode)[0];
    const totalHariKerja = dataPeriode.totalHariKerja ?? nilaiLamaPertama?.totalHariKerja ?? 22;
    const entries = dataPeriode.entries || {};

    function ubahTotalHariKerja(value) {
      const angka = value === '' ? '' : Math.max(0, Number(value) || 0);
      const next = { ...semua, [periode]: { ...dataPeriode, totalHariKerja: angka, entries } };
      setSemua(next);
      simpanUangMakan(next);
    }

    function ubahBaris(nip, field, value) {
      const angka = field === 'keterangan' ? value : value === '' ? '' : Math.max(0, Number(value) || 0);
      const existing = entries[nip] || { cuti: 0, dl: 0, sakit: 0, tk: 0, keterangan: '' };
      const next = { ...semua, [periode]: { ...dataPeriode, totalHariKerja, entries: { ...entries, [nip]: { ...existing, [field]: angka } } } };
      setSemua(next);
      simpanUangMakan(next);
    }

    async function handleImporCSV(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const baris = parseCSV(text, normalisasiHeaderUangMakan).map(normalisasiBarisUangMakan);
        if (!baris.length) { showToastLokal('File tidak berisi data yang bisa dibaca.'); return; }

        // Cocokkan tiap baris CSV ke pegawai lewat NIP (utama) atau nama (cadangan bila NIP kosong/beda).
        const petaNip = {}; const petaNama = {};
        pegawai.forEach((p) => { petaNip[p.nip.replace(/\s+/g, '')] = p; petaNama[p.nama.toLowerCase()] = p; });

        let cocok = 0; let takCocok = 0;
        const entriesBaru = { ...entries };
        baris.forEach((b) => {
          const p = petaNip[b.nip] || petaNama[b.nama.toLowerCase()];
          if (!p) { takCocok++; return; }
          cocok++;
          entriesBaru[p.nip] = { cuti: b.cuti, dl: b.dl, sakit: b.sakit, tk: b.tk, keterangan: b.keterangan };
        });

        const next = { ...semua, [periode]: { ...dataPeriode, totalHariKerja, entries: entriesBaru } };
        setSemua(next);
        simpanUangMakan(next);
        showToastLokal(`Impor selesai: ${cocok} pegawai terisi otomatis${takCocok ? `, ${takCocok} baris tidak cocok dengan NIP/nama manapun` : ''}.`);
      } catch (err) {
        showToastLokal('Gagal membaca file. Pastikan formatnya CSV.');
      } finally {
        ev.target.value = '';
      }
    }

    // Toast sendiri di sini karena UangMakan belum menerima prop showToast dari GajiBerkala.
    const [pesanToast, setPesanToast] = useState('');
    function showToastLokal(pesan) {
      setPesanToast(pesan);
      setTimeout(() => setPesanToast(''), 3200);
    }

    const baris = useMemo(() => {
      const totalKerja = Number(totalHariKerja) || 0;
      return pegawai
        .filter((p) => !query || p.nama.toLowerCase().includes(query.toLowerCase()))
        .map((p) => {
          const d = entries[p.nip] || { cuti: 0, dl: 0, sakit: 0, tk: 0, keterangan: '' };
          const potongan = (Number(d.cuti) || 0) + (Number(d.dl) || 0) + (Number(d.sakit) || 0) + (Number(d.tk) || 0);
          const hariHadir = Math.max(0, totalKerja - potongan);
          const tarif = tarifUangMakan(p.golongan);
          const total = hariHadir * tarif;
          return { p, d, hariHadir, tarif, total };
        });
    }, [pegawai, entries, totalHariKerja, query]);

    const totalKeseluruhan = baris.reduce((acc, b) => acc + b.total, 0);

    return e(
      'div',
      null,
      e(
        'div',
        { className: 'import-note' },
        `Tarif per PMK 32/2025 (SBM 2026): Gol. I & II ${formatRupiah(35000)}, III ${formatRupiah(37000)}, IV ${formatRupiah(41000)} per hari hadir. `,
        'Hari Hadir = Total Hari Kerja (satu nilai untuk semua pegawai) \u2212 (Cuti + DL + Sakit + TK) per orang. Isi kolom Keterangan untuk catat tanggal cuti/sakit/dll.'
      ),
      e(
        'div',
        { className: 'import-box' },
        e('div', { className: 'import-box__icon' }, e(IconUpload, { size: 19 })),
        e(
          'div',
          { className: 'import-box__text' },
          e('div', { className: 'import-box__title' }, 'Impor data cuti/DL/sakit/TK dari CSV/Excel'),
          e('div', { className: 'import-box__desc' }, `Kolom: nip (atau nama), cuti, dl, sakit, tk, keterangan. Baris yang cocok NIP/nama akan mengisi periode ${labelBulan(periode)} otomatis \u2014 baris lain tetap bisa diisi manual.`)
        ),
        e(
          'label',
          { className: 'btn btn-primary', style: { margin: 0 } },
          e(IconUpload, { size: 15 }),
          'Pilih File',
          e('input', { type: 'file', accept: '.csv,text/csv', style: { display: 'none' }, ref: fileInputRef, onChange: handleImporCSV })
        )
      ),
      e(
        'div',
        { className: 'filter-bar' },
        e(
          'div',
          null,
          e('label', { style: { ...fieldStyle(), display: 'block', marginBottom: 4 } }, 'Periode'),
          e('input', { type: 'month', className: 'select-filter', value: periode, onChange: (ev) => setPeriode(ev.target.value) })
        ),
        e(
          'div',
          null,
          e('label', { style: { ...fieldStyle(), display: 'block', marginBottom: 4 } }, 'Total Hari Kerja (semua pegawai)'),
          e('input', { type: 'number', min: 0, className: 'input-angka', style: { width: 72 }, value: totalHariKerja, onChange: (ev) => ubahTotalHariKerja(ev.target.value) })
        ),
        e('div', { className: 'input-search', style: { marginTop: 18 } }, e(IconSearch, { size: 15 }), e('input', { placeholder: 'Cari nama pegawai...', value: query, onChange: (ev) => setQuery(ev.target.value) })),
        e('button', { className: 'btn btn-action-green', style: { marginTop: 18 }, onClick: () => window.print() }, e(IconPrint, { size: 15 }), 'Cetak PDF Rekap')
      ),
      e(
        'div',

  function PeminjamanRuangForm({ initial, prefill, daftar, onClose, onSave }) {
    const kosong = { ruangan: DAFTAR_RUANGAN[0], tanggal: '', jamMulai: '', jamSelesai: '', peminjam: '', kegiatan: '', noSurat: '', ...(prefill || {}) };
    const [form, setForm] = useState(initial || kosong);
    const [error, setError] = useState('');
    const isEdit = !!initial;

    function ubah(field, value) { setForm((f) => ({ ...f, [field]: value })); setError(''); }

    function handleSubmit(ev) {
      ev.preventDefault();
      if (!form.tanggal || !form.jamMulai || !form.jamSelesai || !form.peminjam.trim() || !form.kegiatan.trim()) {
        setError('Ruangan, tanggal, jam, peminjam, dan nama kegiatan wajib diisi.'); return;
      }
      if (form.jamSelesai <= form.jamMulai) {
        setError('Jam selesai harus setelah jam mulai.'); return;
      }
      const bentrok = cekTabrakanJadwal(daftar, form, isEdit ? initial.id : null);
      if (bentrok) {
        setError(`Jadwal bentrok dengan peminjaman "${bentrok.peminjam}" (${bentrok.jamMulai}\u2013${bentrok.jamSelesai}) di ruangan yang sama pada tanggal tersebut.`);
        return;
      }
      onSave(form, initial || null);
    }

    return e(
      Modal,
      { title: isEdit ? 'Edit Peminjaman Ruang' : 'Ajukan Peminjaman Ruang', onClose },

  /* ============================== PEMINJAMAN RUANG (HALAMAN) ============================== */
  function awalMinggu(d) {
    const date = new Date(d);
    const hari = date.getDay(); // 0=Minggu
    const selisih = hari === 0 ? -6 : 1 - hari; // mulai Senin
    date.setDate(date.getDate() + selisih);
    date.setHours(0, 0, 0, 0);
    return date;
  }
  function tambahHari(d, n) {
    const date = new Date(d);
    date.setDate(date.getDate() + n);
    return date;
  }
  function keYMD(d) {
    const p = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
  }

  // Ruangan mana yang sedang dipakai SEKARANG (jam berjalan) — inti dari halaman publik: jawab
  // langsung "ruang mana yang kosong sekarang?" tanpa orang perlu buka kalender/tabel dulu.
  function statusRuanganSekarang(daftar) {
    const now = new Date();
    const hariIni = keYMD(now);
    const jamSekarang = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
    const menitSekarang = now.getHours() * 60 + now.getMinutes();
    const keMenit = (jam) => { const [h, m] = jam.split(':').map(Number); return h * 60 + m; };

    return DAFTAR_RUANGAN.map((ruangan) => {
      const jadwalHariIni = daftar
        .filter((b) => b.ruangan === ruangan && b.tanggal === hariIni)
        .sort((a, b) => a.jamMulai.localeCompare(b.jamMulai));
      const aktif = jadwalHariIni.find((b) => b.jamMulai <= jamSekarang && jamSekarang < b.jamSelesai);
      if (aktif) {
        const mulai = keMenit(aktif.jamMulai);
        const selesai = keMenit(aktif.jamSelesai);
        const progres = Math.min(100, Math.max(0, ((menitSekarang - mulai) / Math.max(1, selesai - mulai)) * 100));
        return { ruangan, aktif, progres };
      }
      const berikutnya = jadwalHariIni.find((b) => b.jamMulai > jamSekarang);
      return { ruangan, aktif: null, berikutnya };
    });
  }

  /* ============================== UNDANGAN PELANTIKAN (CETAK) ============================== */
  function UndanganPelantikanForm({ data, onClose }) {
    const [nomorSurat, setNomorSurat] = useState('');
    const [siapCetak, setSiapCetak] = useState(false);

    useEffect(() => {
      if (siapCetak) {
        const timer = setTimeout(() => window.print(), 250);
        return () => clearTimeout(timer);
      }
    }, [siapCetak]);

    if (siapCetak) {
      return e(
        React.Fragment,
        null,
        e(
          Modal,
          { title: 'Pratinjau Cetak Undangan', onClose },
          e('p', { style: { fontSize: 13, color: 'var(--color-text-muted)', marginBottom: 14 } }, 'Dialog cetak akan terbuka otomatis. Bila tidak muncul, klik tombol di bawah.'),
          e('button', { className: 'btn btn-primary', onClick: () => window.print() }, e(IconPrint, { size: 15 }), 'Cetak Sekarang'),
          e('button', { className: 'btn btn-outline', style: { marginLeft: 8 }, onClick: () => setSiapCetak(false) }, 'Kembali ke Formulir')
        ),
        e(UndanganPelantikanPrintable, { data, nomorSurat })
      );
    }

    return e(
      Modal,
      { title: 'Nomor Surat Undangan', onClose },
      e(
        'form',
        { onSubmit: (ev) => { ev.preventDefault(); setSiapCetak(true); } },
        e('p', { style: { fontSize: 12.5, color: 'var(--color-text-muted)', marginBottom: 12 } }, `Undangan pelantikan untuk: ${data.nama} \u2014 ${data.jabatanBaru}`),
        e('div', null, e('label', { style: fieldStyle() }, 'Nomor Surat Undangan'), e('div', { className: 'input-search' }, e('input', { value: nomorSurat, onChange: (ev) => setNomorSurat(ev.target.value), placeholder: 'W.9-KP.04.02\u2013.../2026', required: true, autoFocus: true }))),
        e(
          'div',
          { style: { display: 'flex', gap: 10, marginTop: 16 } },
          e('button', { type: 'submit', className: 'btn btn-primary' }, e(IconPrint, { size: 15 }), 'Lanjut ke Pratinjau Cetak'),
          e('button', { type: 'button', className: 'btn btn-outline', onClick: onClose }, 'Batal')
        )
      )
    );
  }

  /* ============================== GENERATOR BERKAS PERSIAPAN PELANTIKAN (.docx) ==============================
     Modul ini membuat dokumen Word (lembar 1-8 + SPP/SPMT) mengikuti format resmi Kanwil Kemenkum Lampung,
     dan mendukung banyak pegawai (peserta) sekaligus dalam satu acara pelantikan.
     Library "docx" dimuat via CDN (lihat <head>) dan tersedia sebagai window.docx. */

  function terbilang(n) {
    n = Math.floor(Math.abs(n || 0));
    const satuan = ['', 'SATU', 'DUA', 'TIGA', 'EMPAT', 'LIMA', 'ENAM', 'TUJUH', 'DELAPAN', 'SEMBILAN', 'SEPULUH', 'SEBELAS'];
    if (n < 12) return satuan[n];
    if (n < 20) return `${terbilang(n - 10)} BELAS`;
    if (n < 100) return `${terbilang(Math.floor(n / 10))} PULUH${n % 10 ? ' ' + terbilang(n % 10) : ''}`;
    if (n < 200) return `SERATUS${n % 100 ? ' ' + terbilang(n % 100) : ''}`;
    if (n < 1000) return `${terbilang(Math.floor(n / 100))} RATUS${n % 100 ? ' ' + terbilang(n % 100) : ''}`;
    if (n < 2000) return `SERIBU${n % 1000 ? ' ' + terbilang(n % 1000) : ''}`;
    if (n < 1000000) return `${terbilang(Math.floor(n / 1000))} RIBU${n % 1000 ? ' ' + terbilang(n % 1000) : ''}`;
    return String(n);
  }

  function pecahTanggalAcara(iso) {
    if (!iso) return { hari: '............', tanggalAngka: 0, tanggalKata: '............', bulan: '............', tahun: 0, tahunKata: '............', formatPanjang: '............' };
    const d = new Date(`${iso}T00:00:00`);
    const hari = NAMA_HARI[d.getDay()];
    const bulan = NAMA_BULAN[d.getMonth()];
    const tahun = d.getFullYear();
    return {
      hari, tanggalAngka: d.getDate(), bulan, tahun,
      tanggalKata: terbilang(d.getDate()),
      tahunKata: terbilang(tahun),
      formatPanjang: `${hari}, ${d.getDate()} ${bulan} ${tahun}`,
    };
  }

  /* Beberapa sumber CDN dicoba berurutan supaya unduhan .docx tidak gagal hanya karena satu
     sumber (mis. unpkg.com) diblokir firewall kantor / pemblokir iklan / jaringan lambat. */
  const DOCX_CDN_URLS = [
    'https://unpkg.com/docx@8.5.0/build/index.umd.min.js',
    'https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.min.js',
    'https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/index.umd.min.js',
  ];
  let _docxLoadPromise = null;
  function ensureDocxLib() {
    if (window.docx) return Promise.resolve(window.docx);
    if (_docxLoadPromise) return _docxLoadPromise;
    _docxLoadPromise = (async () => {
      for (const url of DOCX_CDN_URLS) {
        if (window.docx) break;
        try {
          await new Promise((resolve, reject) => {
            const s = document.createElement('script');
            s.src = url;
            s.crossOrigin = 'anonymous';
            s.onload = () => resolve();
            s.onerror = () => reject(new Error(`gagal memuat ${url}`));
            document.head.appendChild(s);
          });
        } catch (err) {
          /* coba sumber CDN berikutnya */
        }
      }
      if (!window.docx) {
        _docxLoadPromise = null;
        throw new Error('Pustaka pembuat .docx gagal dimuat dari semua sumber CDN (unpkg, jsdelivr, cdnjs). Periksa koneksi internet Anda \u2014 kemungkinan ada pemblokir iklan/skrip atau firewall kantor yang memblokir CDN \u2014 lalu coba lagi.');
      }
      return window.docx;
    })();
    return _docxLoadPromise;
  }

  function _docxLib() {
    if (!window.docx) {
      throw new Error('Pustaka pembuat .docx belum siap dimuat. Coba lagi sesaat.');
    }
    return window.docx;
  }

  function _logoBytes() {
    const bin = atob(LOGO_KEMENKUM_PNG_BASE64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  // Semua dokumen memakai Arial 11pt sebagai default (format resmi Kanwil Kemenkum Lampung).
  // Sebelumnya font tidak pernah diset sama sekali di TextRun manapun, sehingga docx.js jatuh
  // ke font bawaan pustaka (Calibri) -- inilah sebabnya hasil unduhan terlihat salah format.
  function _dokumen(children) {
    const { Document } = _docxLib();
    return new Document({
      styles: {
        default: {
          document: { run: { font: 'Arial', size: 22 } },
        },
      },
      sections: [{ properties: {}, children }],
    });
  }

  const _noBorder = { style: 'none', size: 0, color: 'FFFFFF' };
  function _noBorders() {
    return { top: _noBorder, bottom: _noBorder, left: _noBorder, right: _noBorder, insideHorizontal: _noBorder, insideVertical: _noBorder };
  }

  function kopSurat(judulSempit) {
    const { Table, TableRow, TableCell, Paragraph, TextRun, ImageRun, WidthType, VerticalAlign, AlignmentType, BorderStyle } = _docxLib();
    const teksKop = judulSempit
      ? [['KEMENTERIAN HUKUM', true, 21], ['REPUBLIK INDONESIA', false, 21], ['KANTOR WILAYAH LAMPUNG', true, 22]]
      : [['KEMENTERIAN HUKUM', true, 21], ['REPUBLIK INDONESIA', false, 21], ['KANTOR WILAYAH LAMPUNG', true, 22]];

  function DocPreviewPage({ kode, acara, halaman }) {
    const { kop, blocks } = useMemo(() => blokPratinjau(kode, acara, halaman || 0), [kode, acara, halaman]);
    const renderBlok = (b, i) => {
      if (b.t === 'title') return e('p', { key: i, className: 'doc-preview-title' }, b.text);
      if (b.t === 'space') return e('div', { key: i, className: 'doc-preview-space', style: { height: b.h || 8 } });
      if (b.t === 'label') return e('div', { key: i, className: 'doc-preview-label-row' }, e('span', { className: 'lbl' }, b.label), e('span', null, ': ', b.value || '............'));
      if (b.t === 'note') return e('p', { key: i, className: 'doc-preview-note' }, b.text);
      if (b.t === 'table') return e(
        'table', { key: i, className: 'doc-preview-table' },
        e('thead', null, e('tr', null, b.head.map((h, hi) => e('th', { key: hi }, h)))),
        e('tbody', null, b.rows.map((row, ri) => e('tr', { key: ri }, row.map((v, ci) => e('td', { key: ci }, v || '-')))))
      );
      if (b.t === 'sign') return e(
        'div', { key: i, className: 'doc-preview-sign' },
        b.lines.map((ln, li) => ln.gap ? e('div', { key: li, className: 'gap' }) : e('p', { key: li, className: `doc-preview-p right${ln.bold ? ' bold' : ''}`, style: { margin: 0 } }, ln.text))
      );
      return e('p', { key: i, className: `doc-preview-p ${b.align || 'justify'}${b.bold ? ' bold' : ''}` }, b.text);
    };
    return e(
      'div', { className: 'doc-preview-page' },
      kop === 'penuh' && e(
        'div', null,
        e('div', { className: 'doc-preview-kop' },
          e('img', { src: LOGO_DATA_URL, className: 'doc-preview-kop__logo', alt: 'Logo' }),
          e('div', { className: 'doc-preview-kop__text' },
            e('p', { className: 'b1' }, 'KEMENTERIAN HUKUM'), e('p', { className: 'b2' }, 'REPUBLIK INDONESIA'), e('p', { className: 'b3' }, 'KANTOR WILAYAH LAMPUNG'),
            e('p', { className: 'addr' }, 'Jl. RW. Monginsidi No. 184, Bandar Lampung'),
            e('p', { className: 'addr' }, 'Telp. (0721) 474813 Fax. (0721) 471060, e-mail: lampung.kepegawaian@gmail.com')
          )
        ),
        e('hr', { className: 'doc-preview-hr' })
      ),
      kop === 'kecil' && e('div', { className: 'doc-preview-logo-solo' }, e('img', { src: LOGO_DATA_URL, alt: 'Logo' })),
      kop === 'sampul'
        ? e('div', { className: 'doc-preview-cover' }, e('img', { src: LOGO_DATA_URL, alt: 'Logo' }), e('div', { className: 'txt' }, blocks.map(renderBlok)))
        : blocks.map(renderBlok)
    );
  }

  /* ============================== RINGKASAN PRATINJAU (SEBELUM UNDUH .DOCX) ==============================
     Menyusun ringkasan data yang akan masuk ke setiap berkas, supaya admin bisa memeriksa dulu
     (terutama nomor SPP/SPMT yang berbeda tiap orang) sebelum benar-benar mengunduh file .docx. */
  function ringkasanPratinjau(kode, acara) {
    const t = pecahTanggalAcara(acara.tanggal);
    const peserta = acara.peserta || [];
    switch (kode) {
      case 'undangan':
        return {
          fields: [
            ['Nomor Surat', acara.nomorUndangan || '-'],
            ['Hari, Tanggal', t.formatPanjang],
            ['Waktu', `${acara.waktu || '-'} WIB`],
            ['Tempat', acara.tempat || '-'],
          ],
          table: { head: ['No', 'Nama', 'Jabatan Baru', 'Unit Kerja'], rows: peserta.map((p, i) => [i + 1, p.nama || '-', p.jabatanBaru || '-', p.unitKerjaBaru || '-']) },
          catatan: 'Satu surat untuk semua peserta \u2014 daftar nama di bawah menjadi lampirannya, bukan surat terpisah per orang.',
        };
      case 'lembar-1':
        return {
          fields: [
            ['Hari, Tanggal', t.formatPanjang],
            ['Pejabat Pelantik', `${(acara.pejabatPelantik && acara.pejabatPelantik.nama) || '-'} \u2014 ${(acara.pejabatPelantik && acara.pejabatPelantik.jabatan) || '-'}`],
          ],
          table: null,
          catatan: 'Naskah pelantikan berupa teks baku (tidak menyebut nama satu-satu); nama peserta ada pada Keputusan Menteri (SK).',
        };
      case 'lembar-2':
        return { fields: [['Hari, Tanggal', t.formatPanjang]], table: null, catatan: 'Naskah sumpah jabatan baku sesuai peraturan \u2014 tidak ada data yang perlu disesuaikan.' };
      case 'lembar-3':
        return {
          fields: [
            ['Nomor SK', (acara.skList || []).map((s) => `${s.nomor || '-'}${s.tanggal ? ' (' + fmtTglIndo(s.tanggal) + ')' : ''}`).join('; ') || '-'],
            ['Tentang', acara.skTentang || '-'],
            ['Ditetapkan di', acara.tempatPenetapanSK || '-'],
            ['Penandatangan (a.n. Menteri)', `${(acara.penandatanganSK && acara.penandatanganSK.nama) || '-'} \u2014 ${(acara.penandatanganSK && acara.penandatanganSK.jabatan) || '-'}`],
          ],
          table: { head: ['No', 'Nama', 'Jabatan Baru', 'Unit Kerja'], rows: peserta.map((p, i) => [i + 1, p.nama || '-', p.jabatanBaru || '-', p.unitKerjaBaru || '-']) },
          catatan: 'Tabel "MENGANGKAT" pada SK akan memuat seluruh baris peserta di atas secara otomatis.',
        };
      case 'lembar-4-5':
        return {
          fields: [
            ['Hari, Tanggal', t.formatPanjang], ['Waktu', `${acara.waktu || '-'} WIB`], ['Tempat', acara.tempat || '-'],
            ['Pejabat Pelantik', (acara.pejabatPelantik && acara.pejabatPelantik.nama) || '-'],
            ['Kepala Kantor Wilayah', (acara.kepalaKantorWilayah && acara.kepalaKantorWilayah.nama) || '-'],
            ['Rohaniwan', acara.rohaniwan || '-'],
            ['Perwira Upacara', (acara.perwiraUpacara && acara.perwiraUpacara.nama) || '-'],
          ],
          table: null,
          catatan: 'Rundown 2 halaman (lembar 4 dan 5) diunduh sebagai satu berkas dengan pemisah halaman otomatis.',
        };
      case 'lembar-6':
        return {
          fields: [
            ['Hari, Tanggal', t.formatPanjang], ['Waktu', `${acara.waktu || '-'} WIB`], ['Tempat', acara.tempat || '-'],
            ['Penanggung Jawab', (acara.perwiraUpacara && acara.perwiraUpacara.jabatan) || '-'],
            ['MC', acara.petugas.mc || '-'], ['Pembaca SK', acara.petugas.pembacaSK || '-'], ['Dirigen', acara.petugas.dirigen || '-'],
            ['Protokoler', acara.petugas.protokoler || '-'], ['Pembawa Baki', acara.petugas.pembawaBaki || '-'], ['Perlengkapan', acara.petugas.perlengkapan || '-'],
          ],
          table: null, catatan: '',
        };
      case 'lembar-7':
        return { fields: [['Judul', 'Pelantikan dan Pengambilan Sumpah Jabatan Fungsional'], ['Bulan, Tahun', acara.tanggal ? `${t.bulan} ${t.tahun}` : '-']], table: null, catatan: '' };
      case 'lembar-8':
        return {
          fields: [['Hari, Tanggal', t.formatPanjang], ['Tempat', acara.tempat || '-']],
          table: { head: ['No', 'Nama', 'NIP', 'Jabatan Baru'], rows: peserta.map((p, i) => [i + 1, p.nama || '-', p.nip || '-', p.jabatanBaru || '-']) },
          catatan: 'Kolom tanda tangan dikosongkan untuk diisi manual saat acara berlangsung.',
        };
      case 'spmt':
        return {
          fields: [['Jumlah Halaman', `${peserta.length || 1} halaman (1 halaman per pegawai)`]],
          table: { head: ['No', 'Nama', 'NIP', 'No. SPMT', 'Jabatan Baru'], rows: peserta.map((p, i) => [i + 1, p.nama || '-', p.nip || '-', p.nomorSPMT || '(belum diisi)', p.jabatanBaru || '-']) },
          catatan: 'Periksa kolom "No. SPMT" \u2014 nomornya berbeda untuk tiap pegawai, pastikan tidak ada yang kosong atau tertukar.',
        };
      case 'spp':
        return {
          fields: [['Jumlah Halaman', `${peserta.length || 1} halaman (1 halaman per pegawai)`]],
          table: { head: ['No', 'Nama', 'NIP', 'No. SPP', 'Jabatan Baru'], rows: peserta.map((p, i) => [i + 1, p.nama || '-', p.nip || '-', p.nomorSPP || '(belum diisi)', p.jabatanBaru || '-']) },
          catatan: 'Periksa kolom "No. SPP" \u2014 nomornya berbeda untuk tiap pegawai, pastikan tidak ada yang kosong atau tertukar.',
        };
      default:
        return { fields: [], table: null, catatan: '' };
    }
  }

    const selesai = checklist.filter((c) => c.selesai).length;

      setChecklist((prev) => {

        simpanChecklistPelantikan(next);
        return next;
      });
      setLabelBaru('');
    }
    function hapus(id) {
      setChecklist((prev) => {
        const next = prev.filter((c) => c.id !== id);
        simpanChecklistPelantikan(next);
        return next;
      });
    }

      try {

  /* ============================== APP ============================== */
  function App() {
    const [authed, setAuthed] = useState(() => sessionStorage.getItem(SESSION_KEY_AUTH) === '1');
    const [showLoginScreen, setShowLoginScreen] = useState(false);
    const [hash, setHash] = useState(window.location.hash || '#/');
    const [sidebarOpen, setSidebarOpen] = useState(false);
    const [pegawaiState, setPegawaiState] = useState(() => muatDataPegawai());
    const [toast, setToast] = useState('');
    const [notifikasi, setNotifikasi] = useState(() => muatNotifikasi());
    const toastTimer = useRef(null);

    useEffect(() => {
      function onHashChange() {
        setHash(window.location.hash || '#/');
        window.scrollTo(0, 0);
      }
      window.addEventListener('hashchange', onHashChange);
      return () => window.removeEventListener('hashchange', onHashChange);
    }, []);

    // showToast adalah satu-satunya jalur "sesuatu terjadi" di aplikasi ini (tambah/ubah/hapus
    // pegawai, jadwal ruang, pengajuan, sinkron, dsb.) — jadi tiap toast otomatis juga tercatat
    // sebagai notifikasi permanen yang bisa dibuka lewat ikon lonceng, bukan cuma sekilas lewat.
    function showToast(message) {
      setToast(message);
      clearTimeout(toastTimer.current);
      toastTimer.current = setTimeout(() => setToast(''), 2600);
      setNotifikasi((prev) => {
        const next = [{ id: `n-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`, pesan: message, waktu: Date.now(), dibaca: false }, ...prev].slice(0, 50);
        simpanNotifikasi(next);
        return next;
      });
    }

    function handleBacaSemuaNotifikasi() {
      setNotifikasi((prev) => {
        const next = prev.map((n) => ({ ...n, dibaca: true }));
        simpanNotifikasi(next);
        return next;
      });
    }

    function handleHapusNotifikasi() {
      setNotifikasi([]);
      simpanNotifikasi([]);
    }

    function handleImport(rows) {
      simpanDataPegawai(rows);
      setPegawaiState({ data: rows, sumber: 'impor' });
    }

    function handleReset() {
      hapusDataImpor();
      setPegawaiState(muatDataPegawai());
    }

    function handleSavePegawai(data, original) {
      setPegawaiState((prev) => {
        const list = original
          ? prev.data.map((p) => (p.nip === original.nip ? { ...p, ...data } : p))
          : [{ ...data }, ...prev.data];
        simpanDataPegawai(list);
        return { data: list, sumber: 'impor' };
      });
      showToast(original ? `Data ${data.nama} diperbarui.` : `${data.nama} ditambahkan ke daftar pegawai.`);
    }

    function handleLogout() {
      sessionStorage.removeItem(SESSION_KEY_AUTH);
      setAuthed(false);
      setShowLoginScreen(false);
      window.location.hash = '#/';
    }

    if (!authed && showLoginScreen) {
      return e(
        React.Fragment,
        null,
        e(Login, { onSuccess: () => setAuthed(true), onBack: () => setShowLoginScreen(false) }),
        e('div', { className: `toast ${toast ? 'show' : ''}` }, toast)
      );
    }

    if (!authed) {
      return e(
        React.Fragment,
        null,
        e(
          'div',
          { className: 'public-shell' },
          e(
            'header',
            { className: 'public-header' },
            e(
              'div',
              { className: 'public-header__brand' },
              e('div', { className: 'sidebar-brand__badge' }, e(LogoPengayomanLampung, { size: 24 })),
              e('div', null, e('div', { className: 'public-header__title' }, 'Jadwal Peminjaman Ruang'), e('div', { className: 'public-header__subtitle' }, 'Kanwil Kemenkum Lampung'))
            ),
            e(
              'div',
              { className: 'public-header__right' },
              e(LiveClock),
              e('button', { className: 'btn btn-primary', onClick: () => setShowLoginScreen(true) }, e(IconLock, { size: 15 }), 'Masuk Admin')
            )
          ),
          e('div', { className: 'public-content' }, e(PeminjamanRuang, { showToast, isAdmin: false }))
        ),
        e('div', { className: `toast ${toast ? 'show' : ''}` }, toast)
      );
    }

    const meta = ROUTE_META[hash] || { title: 'SIMPATIK Lampung', subtitle: '' };
    const closeSidebar = () => setSidebarOpen(false);

    let page;
    if (hash === '#/') page = e(Dashboard, { pegawai: pegawaiState.data });
    else if (hash === '#/kepegawaian/data-pegawai')
      page = e(DataPegawai, { pegawai: pegawaiState.data, sumber: pegawaiState.sumber, onImport: handleImport, onReset: handleReset, onSavePegawai: handleSavePegawai, showToast });
    else if (hash === '#/kepegawaian/cuti') page = e(Cuti);
    else if (hash === '#/kepegawaian/kenaikan-pangkat') page = e(KenaikanPangkat, { pegawai: pegawaiState.data, showToast });
    else if (hash === '#/kepegawaian/gaji-berkala') page = e(GajiBerkala, { pegawai: pegawaiState.data });
    else if (hash === '#/kepegawaian/inventaris-jf') page = e(InventarisJF, { pegawai: pegawaiState.data, onSavePegawai: handleSavePegawai, showToast });
    else if (hash === '#/kepegawaian/pelantikan') page = e(PersiapanPelantikan, { pegawai: pegawaiState.data, showToast });
    else if (hash === '#/kepegawaian/presensi') page = e(Presensi);
    else if (hash === '#/fasilitas/peminjaman-ruang') page = e(PeminjamanRuang, { showToast, isAdmin: true });
    else if (hash === '#/simoris') page = e(Simoris);
    else page = e(NotFound);

    return e(
      'div',
      null,
      e(
        'div',
        { className: 'app-shell' },
        e(Sidebar, { hash, open: sidebarOpen, onClose: closeSidebar, onLogout: handleLogout }),
        e(
          'div',
          { className: 'main-area' },
          e(Topbar, {
            title: meta.title, subtitle: meta.subtitle, onMenuClick: () => setSidebarOpen(true), onLogout: handleLogout,
            notifikasi, onBacaSemua: handleBacaSemuaNotifikasi, onHapusSemua: handleHapusNotifikasi,
          }),
          e('div', { className: 'page-content' }, page)
        )
      ),
      e('div', { className: `toast ${toast ? 'show' : ''}` }, toast)
    );
  }

  const container = document.getElementById('root');
  const root = ReactDOM.createRoot(container);
  root.render(e(App));
})();
  </script>
</body>
</html>
