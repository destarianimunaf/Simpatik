  <title>SIMPATIK — Sistem Informasi Manajemen Pegawai Aparatur Terintegrasi Kanwil Kemenkum Lampung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!--
    SIMPATIK Lampung — versi satu file (single-file).
    Tidak ada proses build/instalasi apa pun: React & ReactDOM dimuat dari CDN
    saat halaman dibuka, dan seluruh kode aplikasi ada di dalam file ini.
    Cukup unggah file index.html ini sendirian ke Cloudflare Pages (atau hosting statis apa pun).
  -->
  <style>
:root {
  --color-bg: #F3F5FA;
  --color-surface: #FFFFFF;
  --color-border: #E7E9F2;
  --color-text: #1D2130;
  --color-text-muted: #6B7180;
  --color-text-faint: #9AA0AF;

  --color-primary: #4F46E5;
  --color-primary-dark: #4338CA;
  --color-primary-soft: #EEF0FF;

  --color-maroon: #7A1730;
  --color-maroon-dark: #591020;
  --color-gold: #C9A227;

  --color-success: #16A34A;
  --color-success-soft: #E9F9EF;
  --color-warning: #D97706;
  --color-warning-soft: #FEF3E2;
  --color-danger: #DC2626;
  --color-danger-soft: #FCEAEA;
  --color-info: #0EA5E9;
  --color-info-soft: #E7F6FE;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;

  --shadow-sm: 0 1px 2px rgba(20, 20, 43, 0.04);
  --shadow-md: 0 4px 16px rgba(20, 20, 43, 0.06);
  --shadow-lg: 0 12px 32px rgba(20, 20, 43, 0.10);

  --font-display: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }
html, body, #app { height: 100%; }

body {
  margin: 0;
  font-family: var(--font-display);
  background: var(--color-bg);
  color: var(--color-text);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
table { border-collapse: collapse; width: 100%; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #D6D9E5; border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

/* ===== Layout ===== */
.app-shell { display: flex; min-height: 100vh; }

.main-area {
  flex: 1;
  min-width: 0;
  margin-left: 264px;
  display: flex;
  flex-direction: column;
}

.page-content { padding: 24px 28px 48px; flex: 1; }

@media (max-width: 960px) { .main-area { margin-left: 0; } }

/* ===== Sidebar ===== */
.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 264px;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  z-index: 40;
  transition: transform 0.2s ease;
}

@media (max-width: 960px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
}

.sidebar-brand {
  display: flex; align-items: center; gap: 12px;
  padding: 20px 20px 18px;
  border-bottom: 1px solid var(--color-border);
}

.sidebar-brand__badge {
  width: 40px; height: 40px; border-radius: 10px;
  background: linear-gradient(145deg, var(--color-maroon), var(--color-maroon-dark));
  display: flex; align-items: center; justify-content: center;
  color: var(--color-gold); font-weight: 800; font-size: 15px;
  flex-shrink: 0; box-shadow: var(--shadow-sm);
}

.sidebar-brand__text { line-height: 1.25; min-width: 0; }
.sidebar-brand__title { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-brand__subtitle { font-size: 11.5px; color: var(--color-text-muted); }

.sidebar-close-btn { margin-left: auto; display: none; }
@media (max-width: 960px) { .sidebar-close-btn { display: flex; } }

.sidebar-nav { flex: 1; overflow-y: auto; padding: 14px 12px 20px; }

.sidebar-group-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--color-text-faint);
  padding: 16px 12px 6px;
}

.sidebar-link {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px; border-radius: var(--radius-sm);
  font-size: 13.5px; font-weight: 500; color: var(--color-text-muted);
  margin-bottom: 2px; position: relative;
}

.sidebar-link svg { flex-shrink: 0; }
.sidebar-link:hover { background: var(--color-bg); color: var(--color-text); }
.sidebar-link.active { background: var(--color-primary-soft); color: var(--color-primary-dark); font-weight: 600; }
.sidebar-link__external { margin-left: auto; color: var(--color-text-faint); }

.sidebar-footer {
  padding: 14px 20px; border-top: 1px solid var(--color-border);
  font-size: 11.5px; color: var(--color-text-faint);
}

.sidebar-backdrop {
  display: none;
  position: fixed; inset: 0; background: rgba(20,20,43,0.35); z-index: 35;
}
.sidebar-backdrop.open { display: block; }
@media (min-width: 961px) { .sidebar-backdrop { display: none !important; } }

/* ===== Topbar ===== */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 16px;
  padding: 14px 28px;
  background: rgba(243, 245, 250, 0.85);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--color-border);
}

.topbar-menu-btn {
  display: none; background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-sm); width: 36px; height: 36px;
  align-items: center; justify-content: center;
}
@media (max-width: 960px) { .topbar-menu-btn { display: flex; } }

.topbar-title { font-size: 17px; font-weight: 700; }
.topbar-breadcrumb { font-size: 12px; color: var(--color-text-muted); }

.topbar-search {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-sm); padding: 8px 12px; width: 260px;
  color: var(--color-text-faint);
}
.topbar-search input { border: none; outline: none; background: transparent; font-size: 13px; width: 100%; color: var(--color-text); }
@media (max-width: 720px) { .topbar-search { display: none; } }

.topbar-icon-btn {
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  background: var(--color-surface); border: 1px solid var(--color-border);
  display: flex; align-items: center; justify-content: center;
  color: var(--color-text-muted); position: relative; flex-shrink: 0;
}
.topbar-icon-btn .dot {
  position: absolute; top: 7px; right: 7px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--color-danger); border: 1.5px solid var(--color-surface);
}

.topbar-user {
  display: flex; align-items: center; gap: 9px;
  padding: 5px 10px 5px 5px; border-radius: 999px;
  background: var(--color-surface); border: 1px solid var(--color-border); flex-shrink: 0;
}
.topbar-user__avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--color-primary);
  color: #fff; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
}
.topbar-user__name { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
.topbar-user__role { font-size: 10.5px; color: var(--color-text-muted); }

/* ===== Cards / commons ===== */
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.card-pad { padding: 20px; }
.section-title { font-size: 15px; font-weight: 700; }
.section-subtitle { font-size: 12.5px; color: var(--color-text-muted); margin-top: 2px; }

.page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-header h1 { font-size: 21px; margin: 0 0 4px; font-weight: 800; }
.page-header p { margin: 0; color: var(--color-text-muted); font-size: 13px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px;
  border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; border: 1px solid transparent;
}
.btn-primary { background: var(--color-primary); color: #fff; }
.btn-primary:hover { background: var(--color-primary-dark); }
.btn-outline { background: var(--color-surface); border-color: var(--color-border); color: var(--color-text); }
.btn-outline:hover { border-color: var(--color-primary); color: var(--color-primary); }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
.badge-success { background: var(--color-success-soft); color: var(--color-success); }
.badge-warning { background: var(--color-warning-soft); color: var(--color-warning); }
.badge-danger { background: var(--color-danger-soft); color: var(--color-danger); }
.badge-info { background: var(--color-info-soft); color: var(--color-info); }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
@media (max-width: 1100px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .stat-grid { grid-template-columns: 1fr; } }

.stat-card { padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.stat-card__top { display: flex; align-items: center; justify-content: space-between; }
.stat-card__icon { width: 38px; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.stat-card__value { font-size: 24px; font-weight: 800; }
.stat-card__label { font-size: 12.5px; color: var(--color-text-muted); }
.stat-card__delta { font-size: 11.5px; font-weight: 700; display: flex; align-items: center; gap: 3px; }
.stat-card__delta.up { color: var(--color-success); }
.stat-card__delta.down { color: var(--color-danger); }

.content-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 960px) { .content-grid { grid-template-columns: 1fr; } }

.data-table th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--color-text-faint); padding: 10px 16px; border-bottom: 1px solid var(--color-border); white-space: nowrap;
}
.data-table td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: #FAFBFF; }

.name-cell { display: flex; align-items: center; gap: 10px; }
.avatar-chip {
  width: 32px; height: 32px; border-radius: 50%; background: var(--color-primary-soft);
  color: var(--color-primary-dark); display: flex; align-items: center; justify-content: center;
  font-size: 11.5px; font-weight: 700; flex-shrink: 0;
}
.table-wrap { overflow-x: auto; }

.filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.input-search {
  display: flex; align-items: center; gap: 8px; background: var(--color-surface);
  border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 8px 12px;
  min-width: 220px; color: var(--color-text-faint);
}
.input-search input { border: none; outline: none; background: transparent; font-size: 13px; width: 100%; color: var(--color-text); }
.select-filter { border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; background: var(--color-surface); color: var(--color-text); }

.activity-item { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--color-border); }
.activity-item:last-child { border-bottom: none; }
.activity-dot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.activity-text { font-size: 12.5px; line-height: 1.4; }
.activity-time { font-size: 11px; color: var(--color-text-faint); margin-top: 2px; }

/* ===== SIMORIS embed page ===== */
.simoris-hero {
  display: flex; align-items: center; gap: 18px; padding: 22px; border-radius: var(--radius-lg);
  background: linear-gradient(120deg, var(--color-maroon), var(--color-maroon-dark)); color: #fff; margin-bottom: 18px;
}
.simoris-hero__icon {
  width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,0.12);
  display: flex; align-items: center; justify-content: center; color: var(--color-gold); flex-shrink: 0;
}
.simoris-hero h1 { margin: 0 0 4px; font-size: 19px; }
.simoris-hero p { margin: 0; opacity: 0.85; font-size: 13px; max-width: 60ch; }

.simoris-frame-wrap {
  border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--color-border);
  background: var(--color-surface); height: 72vh; min-height: 480px; position: relative;
}
.simoris-frame-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
.simoris-fallback {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 10px; text-align: center; padding: 24px; background: var(--color-surface);
}

/* ===== Import CSV ===== */
.import-box {
  border: 1.5px dashed var(--color-border); border-radius: var(--radius-md);
  padding: 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
  background: var(--color-surface); flex-wrap: wrap;
}
.import-box__icon {
  width: 40px; height: 40px; border-radius: 10px; background: var(--color-primary-soft);
  color: var(--color-primary-dark); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.import-box__text { flex: 1; min-width: 200px; }
.import-box__title { font-weight: 700; font-size: 13.5px; }
.import-box__desc { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }
.import-note { font-size: 12px; color: var(--color-text-muted); margin-top: 10px; line-height: 1.6; }
.import-note a { color: var(--color-primary-dark); font-weight: 600; }

.toast {
  position: fixed; bottom: 20px; right: 20px; z-index: 100;
  background: var(--color-text); color: #fff; padding: 12px 18px; border-radius: var(--radius-sm);
  font-size: 13px; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(8px);
  transition: all 0.25s ease; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ===== Login ===== */
.login-wrap {
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
  padding: 24px; background: radial-gradient(circle at 20% 20%, #EEF0FF 0%, var(--color-bg) 55%);
}
.login-card {
  width: 100%; max-width: 380px; background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); padding: 32px 28px;
}
.login-badge {
  width: 48px; height: 48px; border-radius: 12px;
  background: linear-gradient(145deg, var(--color-maroon), var(--color-maroon-dark));
  display: flex; align-items: center; justify-content: center; color: var(--color-gold);
  font-weight: 800; font-size: 16px; margin-bottom: 16px;
}
.login-card h1 { font-size: 19px; margin: 0 0 4px; }
.login-card p.login-sub { margin: 0 0 24px; font-size: 13px; color: var(--color-text-muted); }
.login-field { margin-bottom: 14px; }
.login-field label { display: block; font-size: 12.5px; font-weight: 600; margin-bottom: 6px; }
.login-field .input-search { width: 100%; }
.login-error {
  background: var(--color-danger-soft); color: var(--color-danger); font-size: 12.5px;
  padding: 9px 12px; border-radius: var(--radius-sm); margin-bottom: 14px;
}
.login-note { display: flex; gap: 8px; align-items: flex-start; margin-top: 18px; font-size: 11.5px; color: var(--color-text-faint); line-height: 1.5; }

/* ===== Modal ===== */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(20,20,43,0.4); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal-card {
  width: 100%; max-width: 480px; background: var(--color-surface); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); padding: 24px; max-height: 86vh; overflow-y: auto;
}
.modal-card__header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.modal-close-btn { flex-shrink: 0; }
.detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--color-border); font-size: 13px; }
.detail-row:last-child { border-bottom: none; }
.detail-row span:first-child { color: var(--color-text-muted); }
.detail-row span:last-child { font-weight: 600; text-align: right; }
.row-link { color: var(--color-primary-dark); font-weight: 600; font-size: 12.5px; }

/* ===== Tab bar (mis. Kenaikan Pangkat: Pengajuan vs Kandidat) ===== */
.tab-bar { display: flex; gap: 6px; border-bottom: 1px solid var(--color-border); margin-bottom: 18px; flex-wrap: wrap; }
.tab-btn {
  display: inline-flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer;
  padding: 10px 4px; margin-right: 18px; font-size: 13.5px; font-weight: 600; color: var(--color-text-muted);
  border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
}
.tab-btn:hover { color: var(--color-text); }
.tab-btn.active { color: var(--color-primary-dark); border-bottom-color: var(--color-primary-dark); }

/* ===== Tombol aksi hijau (mis. Kelola/Edit di tabel) ===== */
.btn-action-green {
  display: inline-flex; align-items: center; gap: 5px; background: var(--color-success-soft);
  color: var(--color-success); border: 1px solid transparent; border-radius: 999px;
  padding: 5px 11px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background .15s;
}
.btn-action-green:hover { background: #C9F2DA; }

/* ===== Tabel responsif ala kartu di layar sempit ===== */
@media (max-width: 700px) {
  .data-table thead { display: none; }
  .data-table, .data-table tbody, .data-table tr, .data-table td { display: block; width: 100%; }
  .data-table { border: none; }
  .data-table tr { border: 1px solid var(--color-border); border-radius: 12px; margin-bottom: 10px; padding: 4px 14px; background: var(--color-surface); }
  .data-table td { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--color-border); text-align: right; }
  .data-table td:last-child { border-bottom: none; }
  .data-table td::before { content: attr(data-label); font-size: 11.5px; font-weight: 700; color: var(--color-text-faint); text-align: left; text-transform: uppercase; letter-spacing: .02em; }
  .data-table td:empty::before { content: none; }
  .table-wrap { overflow-x: visible; }
  .filter-bar { flex-direction: column; align-items: stretch; }
  .filter-bar .select-filter { width: 100%; }
  .page-header { flex-direction: column; align-items: stretch; }
  .page-header > div:last-child { display: flex; flex-direction: column; }
}

/* ===== Cetak SK (print) ===== */
.printable-sk { display: none; }
@media print {
  body * { visibility: hidden; }
  .printable-sk, .printable-sk * { visibility: visible; }
  .printable-sk { display: block; position: absolute; top: 0; left: 0; width: 100%; padding: 30px; }
}

  function normalisasiHeader(h) {
    const key = h.trim().toLowerCase();
    const map = {
      nama: 'nama', 'nama pegawai': 'nama', 'nama lengkap': 'nama',
      nip: 'nip',
      jabatan: 'jabatan', 'nama jabatan': 'jabatan',
      golongan: 'golongan', gol: 'golongan', pangkat: 'golongan', 'pangkat/golongan': 'golongan',
      unit: 'unit', 'unit kerja': 'unit', 'satuan kerja': 'unit',
      status: 'status', 'status kepegawaian': 'status',
    };
    return map[key] || key;
  }

  function parseCSV(text) {
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',' || c === ';') {
        row.push(field); field = '';
      } else if (c === '\n') {
        row.push(field); rows.push(row); row = []; field = '';
      } else if (c === '\r') {
        // abaikan
      } else {
        field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }

    const cleaned = rows.filter((r) => r.some((v) => v.trim() !== ''));
    if (!cleaned.length) return [];

    const header = cleaned[0].map(normalisasiHeader);
    return cleaned.slice(1).map((r) => {
      const obj = {};
      header.forEach((h, idx) => { obj[h] = (r[idx] ?? '').trim(); });
      return obj;
    });
  }

  /* ============================== ATURAN KENAIKAN PANGKAT (BKN) ============================== */
  // Dasar hukum: Peraturan BKN No. 4 Tahun 2025 tentang Periodisasi Kenaikan Pangkat PNS
  // (berlaku efektif 1 Oktober 2025, mencabut Peraturan BKN No. 4/2023) — usul kenaikan
  // pangkat kini dibuka 12 kali setahun, setiap tanggal 1 tiap bulan.
  // Syarat kepangkatan: reguler (non-fungsional) min. 4 tahun dalam pangkat terakhir;
  // pilihan/jabatan fungsional tertentu min. 2 tahun dalam pangkat terakhir + Angka Kredit
  // kumulatif terpenuhi + SKP/penilaian kinerja bernilai baik 2 tahun terakhir
  // (ref. PP 11/2017 jo. PP 17/2020, Permenpan RB No. 1/2023 tentang Jabatan Fungsional).
  const SYARAT_TAHUN_FUNGSIONAL = 2;
  const SYARAT_TAHUN_REGULER = 4;
  const KATA_KUNCI_STRUKTURAL = ['kepala kantor', 'kepala divisi', 'kepala bidang', 'kepala bagian', 'kepala sub'];

  function jenisKepegawaian(jabatan) {
    const j = (jabatan || '').toLowerCase();
    return KATA_KUNCI_STRUKTURAL.some((k) => j.includes(k)) ? 'Struktural' : 'Fungsional';
  }

  function parseNIP(nip) {
    const digits = String(nip || '').replace(/\D/g, '');
    if (digits.length < 18) return null;
    const lahir = digits.slice(0, 8);
    const tmtCPNS = digits.slice(8, 14);
    const genderDigit = digits.slice(14, 15);
    return {
      tanggalLahir: `${lahir.slice(6, 8)}-${lahir.slice(4, 6)}-${lahir.slice(0, 4)}`,
      tmtCPNS: `${tmtCPNS.slice(4, 6)}-${tmtCPNS.slice(0, 4)}`,
      jenisKelamin: genderDigit === '1' ? 'Laki-laki' : genderDigit === '2' ? 'Perempuan' : '-',
    };
  }

  function hitungTahunSelisih(tanggalMulai) {
    const mulai = new Date(tanggalMulai);
    if (isNaN(mulai.getTime())) return null;
    const sekarang = new Date();
    let tahun = sekarang.getFullYear() - mulai.getFullYear();
    const belumUlangTahun =
      sekarang.getMonth() < mulai.getMonth() || (sekarang.getMonth() === mulai.getMonth() && sekarang.getDate() < mulai.getDate());
    if (belumUlangTahun) tahun -= 1;
    return tahun;
  }

  function periodeUsulTerdekat() {
    const now = new Date();
    const bulanDepan = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    return bulanDepan.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  function kelayakanPangkat(p) {
    const jenis = jenisKepegawaian(p.jabatan);
    const syarat = jenis === 'Fungsional' ? SYARAT_TAHUN_FUNGSIONAL : SYARAT_TAHUN_REGULER;
    if (!p.tmtPangkat) return { jenis, syarat, masaKerja: null, status: 'Data Belum Lengkap' };
    const masaKerja = hitungTahunSelisih(p.tmtPangkat);
    if (masaKerja === null) return { jenis, syarat, masaKerja: null, status: 'Data Belum Lengkap' };
    return { jenis, syarat, masaKerja, status: masaKerja >= syarat ? 'Siap Diusulkan' : 'Belum Memenuhi' };
  }

    'III/a': [2785700, 4554500], 'III/b': [2903600, 4768800], 'III/c': [3026400, 4960900], 'III/d': [3154400, 5180700],
    'IV/a': [3287800, 5399900], 'IV/b': [3426900, 5628300], 'IV/c': [3571900, 5866400], 'IV/d': [3723000, 6114500], 'IV/e': [3880400, 6373200],
  };
  const KGB_TAHUN = 2;

  function formatRupiah(angka) {
    if (angka === null || angka === undefined || isNaN(angka)) return '-';
    return 'Rp' + Math.round(angka).toLocaleString('id-ID');
  }

  function estimasiGajiPokok(golongan, masaKerjaGolongan) {
    const rentang = TABEL_GAJI_POKOK[golongan];
    if (!rentang || masaKerjaGolongan === null || masaKerjaGolongan === undefined) return null;
    const mkg = Math.max(0, Math.min(32, Math.floor(masaKerjaGolongan / 2) * 2));
    const [min, max] = rentang;
    const nilai = min + (max - min) * (mkg / 32);
    return Math.round(nilai / 100) * 100;
  }

  function infoGajiBerkala(p) {
    const masaKerja = p.tmtPangkat ? hitungTahunSelisih(p.tmtPangkat) : null;
    const gajiSaatIni = masaKerja === null ? null : estimasiGajiPokok(p.golongan, masaKerja);
    if (!p.tmtPangkat || masaKerja === null) {
      return { masaKerja: null, gajiSaatIni: null, gajiSetelahKGB: null, tmtKGBBerikutnya: null, status: 'Data Belum Lengkap' };
    }
    const langkahKGBBerikutnya = (Math.floor(masaKerja / KGB_TAHUN) + 1) * KGB_TAHUN;
    const tmtAwal = new Date(p.tmtPangkat);
    const tmtKGBBerikutnya = new Date(tmtAwal.getFullYear() + langkahKGBBerikutnya, tmtAwal.getMonth(), tmtAwal.getDate());
    const gajiSetelahKGB = estimasiGajiPokok(p.golongan, langkahKGBBerikutnya);
    const now = new Date();
    const jatuhTempoBulanIni = tmtKGBBerikutnya.getFullYear() === now.getFullYear() && tmtKGBBerikutnya.getMonth() === now.getMonth();
    const sudahLewat = tmtKGBBerikutnya < now;
    return {
      masaKerja, gajiSaatIni, gajiSetelahKGB, tmtKGBBerikutnya,
      status: sudahLewat ? 'Jatuh Tempo' : jatuhTempoBulanIni ? 'Jatuh Tempo' : 'Terjadwal',
    };
  }

  function InventarisJF({ pegawai, onSavePegawai, showToast }) {
    const [editingNip, setEditingNip] = useState(null);
    const [pakDraft, setPakDraft] = useState('');
    const [folderDraft, setFolderDraft] = useState('');
    const [query, setQuery] = useState('');

    const daftarJF = useMemo(() => pegawai.filter((p) => jenisKepegawaian(p.jabatan) === 'Fungsional'), [pegawai]);
    const filtered = useMemo(
      () => daftarJF.filter((p) => !query || (p.nama || '').toLowerCase().includes(query.toLowerCase()) || (p.jabatan || '').toLowerCase().includes(query.toLowerCase())),
      [daftarJF, query]
    );

    function mulaiEdit(p) {
      setEditingNip(p.nip);
      setPakDraft(p.besaranPAK || '');
      setFolderDraft(p.folderPAK || '');
    }

    function simpanEdit(p) {

      ),
      e(
        'div',
        { className: 'filter-bar' },
        e('div', { className: 'input-search' }, e(IconSearch, { size: 15 }), e('input', { placeholder: 'Cari nama atau jabatan fungsional...', value: query, onChange: (ev) => setQuery(ev.target.value) }))

  /* ============================== GAJI BERKALA ============================== */
  function GajiBerkala({ pegawai }) {
    const [query, setQuery] = useState('');
    const [hanyaJatuhTempo, setHanyaJatuhTempo] = useState(false);
    const [cetakUntuk, setCetakUntuk] = useState(null);

    const baris = useMemo(() => pegawai.map((p) => ({ p, g: infoGajiBerkala(p) })), [pegawai]);
    const jatuhTempo = baris.filter((b) => b.g.status === 'Jatuh Tempo');
    const belumLengkap = baris.filter((b) => b.g.status === 'Data Belum Lengkap').length;

    const dasar = hanyaJatuhTempo ? jatuhTempo : baris;
    const tampil = dasar.filter((b) => !query || (b.p.nama || '').toLowerCase().includes(query.toLowerCase()));

    useEffect(() => {
      if (cetakUntuk) {
        const timer = setTimeout(() => window.print(), 200);
        return () => clearTimeout(timer);
      }
    }, [cetakUntuk]);

    return e(
      'div',
      null,
      e(
        'div',
        { className: 'page-header' },
        e('div', null, e('h1', null, 'Gaji Berkala'), e('p', null, 'Estimasi gaji pokok & jadwal Kenaikan Gaji Berkala (KGB) tiap 2 tahun per pegawai.'))
      ),
      e(
        'div',
        { className: 'import-note' },
        e('strong', null, 'Dasar hukum: '),
        'Peraturan Pemerintah No. 5 Tahun 2024 tentang gaji pokok PNS (masih berlaku, belum ada PP pengganti per pengecekan terakhir). KGB diberikan otomatis tiap ',
        e('strong', null, `${KGB_TAHUN} tahun`),
        ' sekali selama penilaian kinerja minimal "baik", dihitung dari TMT golongan terakhir yang sama dipakai di menu Kenaikan Pangkat. ',
        e('strong', null, 'Catatan: '),
        'nilai gaji pokok di sini adalah estimasi hasil interpolasi dari titik MKG 0 dan MKG 32 resmi PP 5/2024 (aplikasi tidak menyimpan seluruh 17 baris tabel resmi) — verifikasi angka pasti di aplikasi GPP/SIMPEG sebelum menerbitkan SK final.',
        belumLengkap > 0 && e('span', null, ` ${belumLengkap} pegawai belum punya TMT Pangkat Terakhir \u2014 lengkapi lewat Edit Data di Data Pegawai.`)
      ),
      e(
        'div',
        { className: 'stat-grid', style: { gridTemplateColumns: 'repeat(3, 1fr)' } },
        e(StatCard, { icon: IconWallet, label: 'Jatuh Tempo Bulan Ini/Lewat', value: String(jatuhTempo.length), tone: 'success' }),
        e(StatCard, { icon: IconClock, label: 'Terjadwal (Belum Jatuh Tempo)', value: String(baris.filter((b) => b.g.status === 'Terjadwal').length), tone: 'info' }),
        e(StatCard, { icon: IconUsers, label: 'Data Belum Lengkap', value: String(belumLengkap), tone: 'warning' })
      ),
      e(
        'div',
        { className: 'filter-bar' },
        e('div', { className: 'input-search' }, e(IconSearch, { size: 15 }), e('input', { placeholder: 'Cari nama pegawai...', value: query, onChange: (ev) => setQuery(ev.target.value) })),
        e('button', { className: 'btn btn-outline', onClick: () => setHanyaJatuhTempo((v) => !v) }, hanyaJatuhTempo ? 'Tampilkan Semua Pegawai' : 'Tampilkan yang Jatuh Tempo Saja')
      ),
      e(
        'div',
        { className: 'card' },
        e(
          'div',
          { className: 'table-wrap' },
          e(
            'table',
            { className: 'data-table' },
            e(
              'thead',
              null,
              e(
                'tr',
                null,
                e('th', null, 'No'), e('th', null, 'Nama'), e('th', null, 'Golongan'), e('th', null, 'Masa Kerja Gol.'),
                e('th', null, 'Gaji Pokok Saat Ini'), e('th', null, 'TMT KGB Berikutnya'), e('th', null, 'Gaji Pokok Setelah KGB'), e('th', null, 'Status'), e('th', null, '')
              )
            ),
            e(
              'tbody',
              null,
              tampil.length
                ? tampil.map(({ p, g }, i) =>
                    e(
                      'tr',
                      { key: i },
                      e('td', { 'data-label': 'No', style: { color: 'var(--color-text-faint)' } }, i + 1),
                      e('td', { 'data-label': 'Nama', style: { fontWeight: 600 } }, p.nama),
                      e('td', { 'data-label': 'Golongan' }, p.golongan),
                      e('td', { 'data-label': 'Masa Kerja Gol.' }, g.masaKerja === null ? '-' : `${g.masaKerja} tahun`),
                      e('td', { 'data-label': 'Gaji Pokok Saat Ini' }, formatRupiah(g.gajiSaatIni)),
                      e('td', { 'data-label': 'TMT KGB Berikutnya' }, g.tmtKGBBerikutnya ? g.tmtKGBBerikutnya.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' }) : '-'),
                      e('td', { 'data-label': 'Gaji Pokok Setelah KGB' }, formatRupiah(g.gajiSetelahKGB)),
                      e('td', { 'data-label': 'Status' }, e(Badge, { status: g.status })),
                      e(
                        'td',
                        { 'data-label': '' },
                        g.status !== 'Data Belum Lengkap' &&
                          e('button', { className: 'btn-action-green', onClick: () => setCetakUntuk({ p, g }), title: 'Cetak SK KGB' }, e(IconPrint, { size: 13 }), 'Cetak SK')
                      )
                    )
                  )
                : e('tr', null, e('td', { colSpan: 9, style: { textAlign: 'center', padding: 32, color: 'var(--color-text-faint)' } }, 'Tidak ada data yang cocok.'))
            )
          )
        )
      ),
      cetakUntuk &&
        e(
          Modal,
          { title: 'Pratinjau Cetak SK', onClose: () => setCetakUntuk(null) },
          e('p', { style: { fontSize: 13, color: 'var(--color-text-muted)', marginBottom: 14 } }, 'Dialog cetak akan terbuka otomatis. Bila tidak muncul, klik tombol di bawah.'),
          e('button', { className: 'btn btn-primary', onClick: () => window.print() }, e(IconPrint, { size: 15 }), 'Cetak Sekarang'),
          e(SkGajiBerkalaPrintable, { pegawai: cetakUntuk.p, info: cetakUntuk.g })
        )
    );
  }

        e('div', { style: { fontWeight: 700, fontSize: 14 } }, 'KANTOR WILAYAH KEMENTERIAN HUKUM LAMPUNG'),
        e('div', { style: { fontSize: 11, marginTop: 4 } }, 'Jl. ................................, Bandar Lampung')
      ),
      e('hr', null),
      e('div', { style: { textAlign: 'center', margin: '16px 0', fontWeight: 700 } },
        e('div', null, 'SURAT KEPUTUSAN'),
        e('div', null, 'KENAIKAN GAJI BERKALA'),
        e('div', { style: { fontWeight: 400 } }, 'Nomor: ......../KP.04.03/.../2026')
      ),
      e('p', null, `Berdasarkan Peraturan Pemerintah Nomor 5 Tahun 2024 tentang Peraturan Gaji Pegawai Negeri Sipil, dengan ini ditetapkan Kenaikan Gaji Berkala atas nama:`),
      e('table', { style: { width: '100%', margin: '10px 0', fontSize: 13 } },
        e('tbody', null,
          e('tr', null, e('td', { style: { width: 160 } }, 'Nama'), e('td', null, `: ${pegawai.nama}`)),
          e('tr', null, e('td', null, 'NIP'), e('td', null, `: ${pegawai.nip}`)),
          e('tr', null, e('td', null, 'Jabatan'), e('td', null, `: ${pegawai.jabatan}`)),
          e('tr', null, e('td', null, 'Golongan Ruang'), e('td', null, `: ${pegawai.golongan}`)),
          e('tr', null, e('td', null, 'Gaji Pokok Lama'), e('td', null, `: ${formatRupiah(info.gajiSaatIni)}`)),
          e('tr', null, e('td', null, 'Gaji Pokok Baru'), e('td', null, `: ${formatRupiah(info.gajiSetelahKGB)}`)),
          e('tr', null, e('td', null, 'Terhitung Mulai Tanggal'), e('td', null, `: ${tmt}`))
        )
      ),
      e('p', { style: { marginTop: 14 } }, 'Demikian surat keputusan ini dibuat untuk dilaksanakan sebagaimana mestinya.'),
      e('div', { style: { display: 'flex', justifyContent: 'flex-end', marginTop: 40 } },
        e('div', { style: { textAlign: 'center' } },
          e('div', null, `Bandar Lampung, ${tglSk}`),
          e('div', null, 'Kepala Kantor Wilayah'),
          e('div', { style: { height: 60 } }),
          e('div', { style: { fontWeight: 700, textDecoration: 'underline' } }, 'TAUFIQURRAKHMAN, S.Sos., S.H., M.Si'),
          e('div', null, 'NIP 19681118 199103 1 001')
        )
      )
    );
  }

  function Presensi() {
    const [query, setQuery] = useState('');
    const filtered = useMemo(() => DATA_PRESENSI.filter((p) => !query || (p.nama || '').toLowerCase().includes(query.toLowerCase())), [query]);
    return e(
      'div',
      null,
      e('div', { className: 'page-header' }, e('div', null, e('h1', null, 'Presensi'), e('p', null, 'Rekap kehadiran pegawai hari ini, 28 Juli 2026. Data pegawai bersumber dari SIMPEG.'))),
      e(
        'div',
        { className: 'stat-grid', style: { gridTemplateColumns: 'repeat(3, 1fr)' } },
        e(StatCard, { icon: IconUserCheck, label: 'Hadir Tepat Waktu', value: '4', tone: 'success' }),
        e(StatCard, { icon: IconClock, label: 'Terlambat', value: '1', tone: 'warning' }),
        e(StatCard, { icon: IconUserX, label: 'Tidak Hadir (Cuti/Sakit)', value: '2', tone: 'info' })
      ),
      e(
        'div',
        { className: 'filter-bar' },
        e('div', { className: 'input-search' }, e(IconSearch, { size: 15 }), e('input', { placeholder: 'Cari nama pegawai...', value: query, onChange: (ev) => setQuery(ev.target.value) }))
      ),
      e(
        'div',
        { className: 'card' },
        e(
          'div',
          { className: 'table-wrap' },
          e(
            'table',
            { className: 'data-table' },
            e('thead', null, e('tr', null, e('th', null, 'No'), e('th', null, 'Nama Pegawai'), e('th', null, 'Jam Masuk'), e('th', null, 'Jam Pulang'), e('th', null, 'Status'))),
            e(
              'tbody',
              null,
              filtered.length
                ? filtered.map((p, i) =>
                    e(
                      'tr',
                      { key: i },
                      e('td', { 'data-label': 'No', style: { color: 'var(--color-text-faint)' } }, i + 1),
                      e('td', { 'data-label': 'Nama Pegawai', style: { fontWeight: 600 } }, p.nama),
                      e('td', { 'data-label': 'Jam Masuk' }, p.masuk),
                      e('td', { 'data-label': 'Jam Pulang' }, p.pulang),
                      e('td', { 'data-label': 'Status' }, e(Badge, { status: p.status }))
                    )
                  )
                : e('tr', null, e('td', { colSpan: 5, style: { textAlign: 'center', padding: 32, color: 'var(--color-text-faint)' } }, 'Tidak ada data yang cocok.'))
            )
          )
        )
      )
    );
  }

  function Simoris() {
    return e(
      'div',
      null,
      e(
        'div',
        { className: 'simoris-hero' },
        e('div', { className: 'simoris-hero__icon' }, e(IconFiles, { size: 24 })),
        e(
          'div',
          { style: { flex: 1 } },
          e('h1', null, 'SIMORIS \u2014 Sistem Penomoran Surat Otomatis'),
          e('p', null, 'Aplikasi eksternal untuk penomoran surat otomatis, terintegrasi langsung di dalam SIMPATIK Lampung.')
        ),
        e(
          'a',
          { href: SIMORIS_URL, target: '_blank', rel: 'noopener noreferrer', className: 'btn', style: { background: 'rgba(255,255,255,0.15)', color: '#fff' } },
          'Buka Tab Baru ',
          e(IconExternal, { size: 15 })
        )
      ),
      e(
        'div',
        { className: 'simoris-frame-wrap' },
        e('iframe', { src: SIMORIS_URL, title: 'SIMORIS', referrerPolicy: 'no-referrer-when-downgrade' })
      ),
      e(
        'p',
        { style: { fontSize: 12, color: 'var(--color-text-muted)', marginTop: 10 } },
        'Jika area di atas tampak kosong, kemungkinan SIMORIS memblokir tampilan tersemat (embed) untuk keamanan \u2014 gunakan tombol ',
        e('strong', null, 'Buka Tab Baru'),
        ' di atas.'
      )
    );
  }

  function NotFound() {
    return e(
      'div',
      { className: 'card card-pad', style: { textAlign: 'center', padding: 60 } },
      e(IconCompass, { size: 36 }),
      e('h1', { style: { margin: '14px 0 6px' } }, 'Halaman tidak ditemukan'),
      e('p', { style: { color: 'var(--color-text-muted)', marginBottom: 18 } }, 'Halaman yang Anda cari tidak tersedia atau sudah dipindahkan.'),
      e('a', { href: '#/', className: 'btn btn-primary', style: { display: 'inline-flex' } }, 'Kembali ke Dashboard')
    );
  }

  /* ============================== APP ============================== */
  function App() {
    const [authed, setAuthed] = useState(() => sessionStorage.getItem(SESSION_KEY_AUTH) === '1');
    const [hash, setHash] = useState(window.location.hash || '#/');
    const [sidebarOpen, setSidebarOpen] = useState(false);
    const [pegawaiState, setPegawaiState] = useState(() => muatDataPegawai());
    const [toast, setToast] = useState('');
    const toastTimer = useRef(null);

    useEffect(() => {
      function onHashChange() {
        setHash(window.location.hash || '#/');
        window.scrollTo(0, 0);
      }
      window.addEventListener('hashchange', onHashChange);
      return () => window.removeEventListener('hashchange', onHashChange);
    }, []);

    function showToast(message) {
      setToast(message);
      clearTimeout(toastTimer.current);
      toastTimer.current = setTimeout(() => setToast(''), 2600);
    }

    function handleImport(rows) {
      simpanDataPegawai(rows);
      setPegawaiState({ data: rows, sumber: 'impor' });
    }

    function handleReset() {
      hapusDataImpor();
      setPegawaiState(muatDataPegawai());
    }

    function handleSavePegawai(data, original) {
      setPegawaiState((prev) => {
        const list = original
          ? prev.data.map((p) => (p.nip === original.nip ? { ...p, ...data } : p))
          : [{ ...data }, ...prev.data];
        simpanDataPegawai(list);
        return { data: list, sumber: 'impor' };
      });
      showToast(original ? `Data ${data.nama} diperbarui.` : `${data.nama} ditambahkan ke daftar pegawai.`);
    }

    function handleLogout() {
      sessionStorage.removeItem(SESSION_KEY_AUTH);
      setAuthed(false);
      window.location.hash = '#/';
    }

    if (!authed) return e(Login, { onSuccess: () => setAuthed(true) });

    const meta = ROUTE_META[hash] || { title: 'SIMPATIK Lampung', subtitle: '' };
    const closeSidebar = () => setSidebarOpen(false);

    let page;
    if (hash === '#/') page = e(Dashboard, { pegawai: pegawaiState.data });
    else if (hash === '#/kepegawaian/data-pegawai')
      page = e(DataPegawai, { pegawai: pegawaiState.data, sumber: pegawaiState.sumber, onImport: handleImport, onReset: handleReset, onSavePegawai: handleSavePegawai, showToast });
    else if (hash === '#/kepegawaian/cuti') page = e(Cuti);
    else if (hash === '#/kepegawaian/kenaikan-pangkat') page = e(KenaikanPangkat, { pegawai: pegawaiState.data, showToast });
    else if (hash === '#/kepegawaian/gaji-berkala') page = e(GajiBerkala, { pegawai: pegawaiState.data });
    else if (hash === '#/kepegawaian/inventaris-jf') page = e(InventarisJF, { pegawai: pegawaiState.data, onSavePegawai: handleSavePegawai, showToast });
    else if (hash === '#/kepegawaian/presensi') page = e(Presensi);
    else if (hash === '#/simoris') page = e(Simoris);
    else page = e(NotFound);

    return e(
      'div',
      null,
      e(
        'div',
        { className: 'app-shell' },
        e(Sidebar, { hash, open: sidebarOpen, onClose: closeSidebar, onLogout: handleLogout }),
        e(
          'div',
          { className: 'main-area' },
          e(Topbar, { title: meta.title, subtitle: meta.subtitle, onMenuClick: () => setSidebarOpen(true), onLogout: handleLogout }),
          e('div', { className: 'page-content' }, page)
        )
      ),
      e('div', { className: `toast ${toast ? 'show' : ''}` }, toast)
    );
  }

  const container = document.getElementById('root');
  const root = ReactDOM.createRoot(container);
  root.render(e(App));
})();
  </script>
