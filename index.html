<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMPATIK — Sistem Informasi Manajemen Pegawai Aparatur Terintegrasi Kanwil Kemenkum Lampung</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!--
    SIMPATIK Lampung — versi satu file (single-file).
    Tidak ada proses build/instalasi apa pun: React & ReactDOM dimuat dari CDN
    saat halaman dibuka, dan seluruh kode aplikasi ada di dalam file ini.
    Cukup unggah file index.html ini sendirian ke Cloudflare Pages (atau hosting statis apa pun).
  -->
  <style>
:root {
  --color-bg: #F3F5FA;
  --color-surface: #FFFFFF;
  --color-border: #E7E9F2;
  --color-text: #1D2130;
  --color-text-muted: #6B7180;
  --color-text-faint: #9AA0AF;

  --color-primary: #4F46E5;
  --color-primary-dark: #4338CA;
  --color-primary-soft: #EEF0FF;

  --color-maroon: #7A1730;
  --color-maroon-dark: #591020;
  --color-gold: #C9A227;

  --color-success: #16A34A;
  --color-success-soft: #E9F9EF;
  --color-warning: #D97706;
  --color-warning-soft: #FEF3E2;
  --color-danger: #DC2626;
  --color-danger-soft: #FCEAEA;
  --color-info: #0EA5E9;
  --color-info-soft: #E7F6FE;

  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;

  --shadow-sm: 0 1px 2px rgba(20, 20, 43, 0.04);
  --shadow-md: 0 4px 16px rgba(20, 20, 43, 0.06);
  --shadow-lg: 0 12px 32px rgba(20, 20, 43, 0.10);

  --font-display: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
}

* { box-sizing: border-box; }
html, body, #app { height: 100%; }

body {
  margin: 0;
  font-family: var(--font-display);
  background: var(--color-bg);
  color: var(--color-text);
  -webkit-font-smoothing: antialiased;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
table { border-collapse: collapse; width: 100%; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #D6D9E5; border-radius: 8px; }
::-webkit-scrollbar-track { background: transparent; }

:focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }

/* ===== Layout ===== */
.app-shell { display: flex; min-height: 100vh; }

.main-area {
  flex: 1;
  min-width: 0;
  margin-left: 264px;
  display: flex;
  flex-direction: column;
}

.page-content { padding: 24px 28px 48px; flex: 1; }

@media (max-width: 960px) { .main-area { margin-left: 0; } }

/* ===== Sidebar ===== */
.sidebar {
  position: fixed;
  top: 0; left: 0; bottom: 0;
  width: 264px;
  background: var(--color-surface);
  border-right: 1px solid var(--color-border);
  display: flex;
  flex-direction: column;
  z-index: 40;
  transition: transform 0.2s ease;
}

@media (max-width: 960px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); box-shadow: var(--shadow-lg); }
}

.sidebar-brand {
  display: flex; align-items: center; gap: 12px;
  padding: 20px 20px 18px;
  border-bottom: 1px solid var(--color-border);
}

.sidebar-brand__badge {
  width: 40px; height: 40px; border-radius: 10px;
  background: linear-gradient(145deg, var(--color-maroon), var(--color-maroon-dark));
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 800; font-size: 15px;
  flex-shrink: 0; box-shadow: var(--shadow-sm);
}

.sidebar-brand__text { line-height: 1.25; min-width: 0; }
.sidebar-brand__title { font-weight: 700; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sidebar-brand__subtitle { font-size: 11.5px; color: var(--color-text-muted); }

.sidebar-close-btn { margin-left: auto; display: none; }
@media (max-width: 960px) { .sidebar-close-btn { display: flex; } }

.sidebar-nav { flex: 1; overflow-y: auto; padding: 14px 12px 20px; }

.sidebar-group-label {
  font-size: 10.5px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--color-text-faint);
  padding: 16px 12px 6px;
}

.sidebar-link {
  display: flex; align-items: center; gap: 11px;
  padding: 9px 12px; border-radius: var(--radius-sm);
  font-size: 13.5px; font-weight: 500; color: var(--color-text-muted);
  margin-bottom: 2px; position: relative;
}

.sidebar-link svg { flex-shrink: 0; }
.sidebar-link:hover { background: var(--color-bg); color: var(--color-text); }
.sidebar-link.active { background: var(--color-primary-soft); color: var(--color-primary-dark); font-weight: 600; }
.sidebar-link__external { margin-left: auto; color: var(--color-text-faint); }

.sidebar-footer {
  padding: 14px 20px; border-top: 1px solid var(--color-border);
  font-size: 11.5px; color: var(--color-text-faint);
}

.sidebar-backdrop {
  display: none;
  position: fixed; inset: 0; background: rgba(20,20,43,0.35); z-index: 35;
}
.sidebar-backdrop.open { display: block; }
@media (min-width: 961px) { .sidebar-backdrop { display: none !important; } }

/* ===== Topbar ===== */
.topbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 16px;
  padding: 14px 28px;
  background: linear-gradient(120deg, var(--color-maroon), var(--color-maroon-dark));
  box-shadow: var(--shadow-md);
}

.topbar-menu-btn {
  display: none; background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22);
  border-radius: var(--radius-sm); width: 36px; height: 36px;
  align-items: center; justify-content: center; color: #fff;
}
@media (max-width: 960px) { .topbar-menu-btn { display: flex; } }

.topbar-title { font-size: 17px; font-weight: 700; color: #fff; }
.topbar-breadcrumb { font-size: 12px; color: rgba(255,255,255,0.72); }

.topbar-search {
  margin-left: auto; display: flex; align-items: center; gap: 8px;
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.24);
  border-radius: var(--radius-sm); padding: 8px 12px; width: 260px;
  color: rgba(255,255,255,0.75);
}
.topbar-search input { border: none; outline: none; background: transparent; font-size: 13px; width: 100%; color: #fff; }
.topbar-search input::placeholder { color: rgba(255,255,255,0.65); }
@media (max-width: 720px) { .topbar-search { display: none; } }

.topbar-icon-btn {
  width: 38px; height: 38px; border-radius: var(--radius-sm);
  background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.22);
  display: flex; align-items: center; justify-content: center;
  color: #fff; position: relative; flex-shrink: 0;
}
.topbar-icon-btn .dot {
  position: absolute; top: 7px; right: 7px; width: 7px; height: 7px;
  border-radius: 50%; background: var(--color-gold); border: 1.5px solid var(--color-maroon-dark);
}

/* ===== Notifikasi ===== */
.notif-wrap { position: relative; flex-shrink: 0; }
.notif-panel {
  position: absolute; top: calc(100% + 8px); right: 0; width: 320px; max-width: 86vw;
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg); z-index: 60; overflow: hidden;
}
.notif-panel__head {
  display: flex; align-items: center; justify-content: space-between; padding: 12px 14px;
  border-bottom: 1px solid var(--color-border); font-size: 13px; font-weight: 700;
}
.notif-panel__clear { background: none; border: none; color: var(--color-text-faint); font-size: 11.5px; font-weight: 600; cursor: pointer; }
.notif-panel__clear:hover { color: var(--color-danger); }
.notif-panel__list { max-height: 340px; overflow-y: auto; }
.notif-item { display: flex; gap: 9px; padding: 11px 14px; border-bottom: 1px solid var(--color-border); align-items: flex-start; }
.notif-item:last-child { border-bottom: none; }
.notif-item.unread { background: var(--color-primary-soft); }
.notif-item__dot { width: 7px; height: 7px; border-radius: 50%; background: var(--color-primary); margin-top: 5px; flex-shrink: 0; opacity: 0; }
.notif-item.unread .notif-item__dot { opacity: 1; }
.notif-item__pesan { font-size: 12.5px; line-height: 1.4; color: var(--color-text); }
.notif-item__waktu { font-size: 11px; color: var(--color-text-faint); margin-top: 2px; }
.notif-empty { padding: 28px 16px; text-align: center; font-size: 12.5px; color: var(--color-text-faint); line-height: 1.5; }
@media (max-width: 480px) { .notif-panel { position: fixed; top: 62px; right: 10px; left: 10px; width: auto; } }

.topbar-user {
  display: flex; align-items: center; gap: 9px;
  padding: 5px 10px 5px 5px; border-radius: 999px;
  background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.24); flex-shrink: 0;
}
.topbar-user__avatar {
  width: 30px; height: 30px; border-radius: 50%; background: var(--color-gold);
  color: #3a2c05; display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700;
}
.topbar-user__name { font-size: 12.5px; font-weight: 600; line-height: 1.2; color: #fff; }
.topbar-user__role { font-size: 10.5px; color: rgba(255,255,255,0.72); }

/* ===== Cards / commons ===== */
.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
.card-pad { padding: 20px; }
.section-title { font-size: 15px; font-weight: 700; }
.section-subtitle { font-size: 12.5px; color: var(--color-text-muted); margin-top: 2px; }

.page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-header h1 { font-size: 21px; margin: 0 0 4px; font-weight: 800; }
.page-header p { margin: 0; color: var(--color-text-muted); font-size: 13px; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px;
  border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; border: 1px solid transparent;
}
.btn-primary { background: var(--color-primary); color: #fff; }
.btn-primary:hover { background: var(--color-primary-dark); }
.btn-outline { background: var(--color-surface); border-color: var(--color-border); color: var(--color-text); }
.btn-outline:hover { border-color: var(--color-primary); color: var(--color-primary); }

.badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 600; }
.badge-success { background: var(--color-success-soft); color: var(--color-success); }
.badge-warning { background: var(--color-warning-soft); color: var(--color-warning); }
.badge-danger { background: var(--color-danger-soft); color: var(--color-danger); }
.badge-info { background: var(--color-info-soft); color: var(--color-info); }

/* ===== Dashboard: hero sambutan ===== */
@keyframes dashFadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes dashBlobFloat { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(-14px, 12px) scale(1.08); } }
@keyframes dashBlobFloat2 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(10px, -10px) scale(1.05); } }
@keyframes dashSparklePulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(1.15); } }
@keyframes dashPingRing { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(2.1); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .dash-hero::before, .dash-hero::after, .dash-hero__eyebrow svg, .activity-dot--live::after { animation: none !important; }
  .dash-anim { animation: none !important; opacity: 1 !important; transform: none !important; }
}

.dash-hero {
  position: relative; overflow: hidden; border-radius: var(--radius-lg); margin-bottom: 20px;
  padding: 26px 28px; color: #fff;
  background: linear-gradient(135deg, var(--color-maroon) 0%, var(--color-maroon-dark) 65%, #3d0c18 100%);
  display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  animation: dashFadeUp .5s ease both;
}
.dash-hero::before {
  content: ''; position: absolute; top: -60px; right: -40px; width: 220px; height: 220px; border-radius: 50%;
  background: radial-gradient(circle, rgba(201,162,39,0.35), transparent 70%);
  animation: dashBlobFloat 9s ease-in-out infinite;
}
.dash-hero::after {
  content: ''; position: absolute; bottom: -80px; right: 120px; width: 180px; height: 180px; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.08), transparent 70%);
  animation: dashBlobFloat2 11s ease-in-out infinite;
}
.dash-hero__main { position: relative; z-index: 1; max-width: 60ch; }
.dash-hero__eyebrow {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; letter-spacing: .04em;
  text-transform: uppercase; background: rgba(255,255,255,0.14); color: var(--color-gold);
  padding: 5px 12px; border-radius: 999px; margin-bottom: 12px;
}
.dash-hero__eyebrow svg { animation: dashSparklePulse 2.4s ease-in-out infinite; }
.dash-hero h1 { margin: 0 0 6px; font-size: 22px; font-weight: 800; }
.dash-hero p { margin: 0; opacity: 0.85; font-size: 13px; line-height: 1.5; }
.dash-hero__actions { position: relative; z-index: 1; display: flex; gap: 10px; flex-wrap: wrap; flex-shrink: 0; }
.dash-hero__actions .btn-primary { background: var(--color-gold); color: #3a2c05; border-color: var(--color-gold); }
.dash-hero__actions .btn-primary:hover { filter: brightness(1.05); transform: translateY(-1px); }
.dash-hero__actions .btn-ghost {
  background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.35);
}
.dash-hero__actions .btn-ghost:hover { background: rgba(255,255,255,0.18); transform: translateY(-1px); }
.dash-hero__actions .btn { transition: transform .15s ease, filter .15s ease, background .15s ease; }
@media (max-width: 640px) { .dash-hero { padding: 20px; } .dash-hero__actions { width: 100%; } .dash-hero__actions .btn { flex: 1 1 auto; justify-content: center; } }

/* ===== Dashboard: aksi cepat ===== */
.quick-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
@media (max-width: 900px) { .quick-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 480px) { .quick-grid { grid-template-columns: 1fr; } }
.quick-tile {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius-md);
  background: var(--color-surface); border: 1px solid var(--color-border); box-shadow: var(--shadow-sm);
  text-decoration: none; color: var(--color-text); transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
  animation: dashFadeUp .45s ease both;
}
.quick-tile:hover { transform: translateY(-3px) scale(1.015); box-shadow: var(--shadow-md); border-color: var(--color-primary); }
.quick-tile:hover .quick-tile__icon { transform: scale(1.1) rotate(-4deg); }
.quick-tile__icon {
  width: 40px; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; background: var(--color-primary-soft); color: var(--color-primary-dark);
  transition: transform .2s ease;
}
.quick-tile__label { font-size: 13px; font-weight: 700; }
.quick-tile__sub { font-size: 11px; color: var(--color-text-faint); margin-top: 1px; }

.stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 20px; }
@media (max-width: 1100px) { .stat-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 560px) { .stat-grid { grid-template-columns: 1fr; } }

.stat-card {
  padding: 20px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden;
  transition: transform .15s ease, box-shadow .15s ease;
  animation: dashFadeUp .5s ease both;
}
.stat-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: var(--stat-accent, var(--color-primary));
}
.stat-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-md); }
.stat-card:hover .stat-card__icon { transform: scale(1.08); }
.stat-card__top { display: flex; align-items: center; justify-content: space-between; }
.stat-card__icon {
  width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.02); transition: transform .2s ease;
}
.stat-card__value { font-size: 26px; font-weight: 800; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.stat-card__label { font-size: 12.5px; color: var(--color-text-muted); }
.stat-card__delta { font-size: 11.5px; font-weight: 700; display: flex; align-items: center; gap: 3px; padding: 3px 8px; border-radius: 999px; }
.stat-card__delta.up { color: var(--color-success); background: var(--color-success-soft); }
.stat-card__delta.down { color: var(--color-danger); background: var(--color-danger-soft); }

.content-grid { display: grid; grid-template-columns: 1.6fr 1fr; gap: 16px; align-items: start; }
@media (max-width: 960px) { .content-grid { grid-template-columns: 1fr; } }
.content-grid > .card { animation: dashFadeUp .55s ease both; animation-delay: .12s; }

.dash-card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.dash-link {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; color: var(--color-primary-dark);
  text-decoration: none; white-space: nowrap; flex-shrink: 0; padding: 4px 2px; transition: gap .15s ease;
}
.dash-link:hover { text-decoration: underline; gap: 7px; }

.activity-dot--live { position: relative; }
.activity-dot--live::after {
  content: ''; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--color-success);
  animation: dashPingRing 1.8s ease-out infinite;
}


.data-table th {
  text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
  color: var(--color-text-faint); padding: 10px 16px; border-bottom: 1px solid var(--color-border); white-space: nowrap;
}
.data-table td { padding: 12px 16px; font-size: 13px; border-bottom: 1px solid var(--color-border); vertical-align: middle; }
.data-table tr:last-child td { border-bottom: none; }
.data-table tr:hover td { background: #FAFBFF; }

.name-cell { display: flex; align-items: center; gap: 10px; }
.avatar-chip {
  width: 32px; height: 32px; border-radius: 50%; background: var(--color-primary-soft);
  color: var(--color-primary-dark); display: flex; align-items: center; justify-content: center;
  font-size: 11.5px; font-weight: 700; flex-shrink: 0;
}
.table-wrap { overflow-x: auto; }

.filter-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
.input-search {
  display: flex; align-items: center; gap: 8px; background: var(--color-surface);
  border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 8px 12px;
  min-width: 0; width: 100%; color: var(--color-text-faint); box-sizing: border-box;
}
.filter-bar .input-search { min-width: 220px; width: auto; flex: 1 1 220px; }
.input-search input { border: none; outline: none; background: transparent; font-size: 13px; width: 100%; min-width: 0; color: var(--color-text); }
.select-filter { border: 1px solid var(--color-border); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 13px; background: var(--color-surface); color: var(--color-text); max-width: 100%; }

/* ===== Combobox pencarian nama pegawai ===== */
.pegawai-combo { position: relative; min-width: 0; }
.pegawai-combo__panel {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg); max-height: 240px; overflow-y: auto; z-index: 55;
}
.pegawai-combo__item {
  display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%;
  padding: 8px 12px; text-align: left; border: none; border-bottom: 1px solid var(--color-border);
  background: transparent; cursor: pointer;
}
.pegawai-combo__item:last-child { border-bottom: none; }
.pegawai-combo__item:hover, .pegawai-combo__item:focus-visible { background: var(--color-bg); }
.pegawai-combo__nama { font-size: 12.5px; font-weight: 600; color: var(--color-text); }
.pegawai-combo__jabatan { font-size: 11px; color: var(--color-text-muted); }

.activity-item { position: relative; display: flex; gap: 12px; padding: 0 0 20px 0; animation: dashFadeUp .4s ease both; }
.activity-item:last-child { padding-bottom: 0; }
.activity-item::before {
  content: ''; position: absolute; left: 14px; top: 30px; bottom: -4px; width: 1px; background: var(--color-border);
}
.activity-item:last-child::before { display: none; }
.activity-dot { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; z-index: 1; }
.activity-text { font-size: 12.5px; line-height: 1.4; }
.activity-time { font-size: 11px; color: var(--color-text-faint); margin-top: 2px; }

/* ===== SIMORIS embed page ===== */
.simoris-hero {
  display: flex; align-items: center; gap: 18px; padding: 22px; border-radius: var(--radius-lg);
  background: linear-gradient(120deg, var(--color-maroon), var(--color-maroon-dark)); color: #fff; margin-bottom: 18px;
}
.simoris-hero__icon {
  width: 52px; height: 52px; border-radius: 14px; background: rgba(255,255,255,0.12);
  display: flex; align-items: center; justify-content: center; color: var(--color-gold); flex-shrink: 0;
}
.simoris-hero h1 { margin: 0 0 4px; font-size: 19px; }
.simoris-hero p { margin: 0; opacity: 0.85; font-size: 13px; max-width: 60ch; }

.simoris-frame-wrap {
  border-radius: var(--radius-md); overflow: hidden; border: 1px solid var(--color-border);
  background: var(--color-surface); height: 72vh; min-height: 480px; position: relative;
}
.simoris-frame-wrap iframe { width: 100%; height: 100%; border: none; display: block; }
.simoris-fallback {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 10px; text-align: center; padding: 24px; background: var(--color-surface);
}

/* ===== Import CSV ===== */
.import-box {
  border: 1.5px dashed var(--color-border); border-radius: var(--radius-md);
  padding: 18px; display: flex; align-items: center; gap: 14px; margin-bottom: 16px;
  background: var(--color-surface); flex-wrap: wrap;
}
.import-box__icon {
  width: 40px; height: 40px; border-radius: 10px; background: var(--color-primary-soft);
  color: var(--color-primary-dark); display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.import-box__text { flex: 1; min-width: 200px; }
.import-box__title { font-weight: 700; font-size: 13.5px; }
.import-box__desc { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }
.import-note { font-size: 12px; color: var(--color-text-muted); margin-top: 10px; line-height: 1.6; }
.import-note a { color: var(--color-primary-dark); font-weight: 600; }

.toast {
  position: fixed; bottom: 20px; right: 20px; z-index: 100;
  background: var(--color-text); color: #fff; padding: 12px 18px; border-radius: var(--radius-sm);
  font-size: 13px; box-shadow: var(--shadow-lg); opacity: 0; transform: translateY(8px);
  transition: all 0.25s ease; pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* ===== Login ===== */
@keyframes loginRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
@keyframes loginFade { from { opacity: 0; } to { opacity: 1; } }

.login-wrap {
  min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  background: var(--color-surface);
}

.login-brand {
  position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between;
  padding: 44px 48px; color: #F6E9C9;
  background: linear-gradient(165deg, var(--color-maroon) 0%, var(--color-maroon-dark) 72%, #3B0C18 100%);
}
.login-brand__eyebrow { font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: #E7C77A; opacity: .85; animation: loginFade .6s ease both; }
.login-brand__eyebrow div:last-child { color: #F6E9C9; opacity: .65; font-size: 10.5px; margin-top: 2px; letter-spacing: .08em; }
.login-brand__mid { animation: loginRise .7s ease .05s both; }
.login-brand__wordmark { font-size: 42px; font-weight: 800; letter-spacing: -.01em; line-height: 1.05; margin: 18px 0 10px; }
.login-brand__tagline { font-size: 14px; color: #F0D9AE; opacity: .85; max-width: 360px; line-height: 1.55; }
.login-brand__rule { width: 46px; height: 3px; background: var(--color-gold); border-radius: 2px; margin: 20px 0 0; }
.login-siger { position: absolute; left: 0; right: 0; bottom: -6px; width: 100%; height: auto; opacity: .5; }
.login-siger-glow { position: absolute; top: -120px; right: -120px; width: 360px; height: 360px; border-radius: 50%;
  background: radial-gradient(circle, rgba(201,162,39,.35) 0%, rgba(201,162,39,0) 70%); }
.login-brand__foot { position: relative; font-size: 11px; color: #E9D3A0; opacity: .75; line-height: 1.6; animation: loginFade .8s ease .1s both; }

.login-form-side { display: flex; align-items: center; justify-content: center; padding: 32px; }
.login-card {
  width: 100%; max-width: 380px; animation: loginRise .55s ease .08s both;
}
.login-card__badge {
  width: 44px; height: 44px; border-radius: 12px;
  background: linear-gradient(145deg, var(--color-maroon), var(--color-maroon-dark));
  display: flex; align-items: center; justify-content: center; color: #fff;
  font-weight: 800; font-size: 15px; margin-bottom: 20px;
}
.login-card h1 { font-size: 21px; margin: 0 0 5px; letter-spacing: -.01em; }
.login-card p.login-sub { margin: 0 0 28px; font-size: 13px; color: var(--color-text-muted); line-height: 1.5; }
.login-field { margin-bottom: 16px; }
.login-field label { display: block; font-size: 11.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--color-text-muted); margin-bottom: 7px; }
.login-field .input-search { width: 100%; transition: border-color .15s, box-shadow .15s; }
.login-field .input-search:focus-within { border-color: var(--color-maroon); box-shadow: 0 0 0 3px rgba(122,23,48,.12); }
.login-error {
  display: flex; align-items: center; gap: 8px;
  background: var(--color-danger-soft); color: var(--color-danger); font-size: 12.5px; font-weight: 500;
  padding: 10px 12px; border-radius: var(--radius-sm); margin-bottom: 16px;
}
.login-submit {
  width: 100%; justify-content: center; background: var(--color-maroon); border-color: var(--color-maroon);
  padding: 11px 16px; font-size: 14px; font-weight: 700; letter-spacing: .01em;
}
.login-submit:hover { background: var(--color-maroon-dark); }
.login-note { display: flex; gap: 8px; align-items: flex-start; margin-top: 20px; font-size: 11.5px; color: var(--color-text-faint); line-height: 1.55; }
.login-back-link {
  display: inline-flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer;
  color: var(--color-text-muted); font-size: 12.5px; font-weight: 600; padding: 0; margin-bottom: 22px;
}
.login-back-link:hover { color: var(--color-maroon); }

/* ===== Flyer bergerak (info berputar otomatis di panel login) ===== */
@keyframes flyerFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.login-flyer { margin-top: 24px; position: relative; z-index: 1; }
.login-flyer__card {
  background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.16); border-radius: var(--radius-md);
  padding: 14px 16px; backdrop-filter: blur(2px); min-height: 76px; animation: flyerFade .45s ease both;
}
.login-flyer__label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--color-gold); margin-bottom: 4px; }
.login-flyer__title { font-size: 13.5px; font-weight: 700; color: #fff; margin-bottom: 3px; line-height: 1.3; }
.login-flyer__desc { font-size: 11.5px; color: rgba(255,255,255,.75); line-height: 1.5; }
.login-flyer__dots { display: flex; gap: 5px; margin-top: 10px; }
.login-flyer__dot { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.3); border: none; padding: 0; cursor: pointer; transition: background .2s, width .2s; }
.login-flyer__dot.active { background: var(--color-gold); width: 16px; border-radius: 3px; }

/* ===== Responsif: laptop kecil / tablet lanskap ===== */
@media (max-width: 1100px) and (min-width: 861px) {
  .login-brand { padding: 36px 36px; }
  .login-brand__wordmark { font-size: 36px; }
  .login-brand__tagline { max-width: 300px; }
}

/* ===== Responsif: tablet potret & HP ===== */
@media (max-width: 860px) {
  .login-wrap { grid-template-columns: 1fr; }
  .login-brand { padding: 28px 24px 40px; min-height: unset; }
  .login-brand__wordmark { font-size: 30px; margin: 12px 0 8px; }
  .login-brand__tagline { font-size: 12.5px; max-width: 480px; }
  .login-brand__foot { display: none; }
  .login-flyer { margin-top: 18px; max-width: 480px; }
  .login-form-side { padding: 28px 22px 40px; }
}

/* ===== Responsif: HP kecil ===== */
@media (max-width: 420px) {
  .login-brand { padding: 22px 18px 30px; }
  .login-brand__wordmark { font-size: 26px; }
  .login-brand__eyebrow { font-size: 10.5px; }
  .login-flyer__card { padding: 12px 14px; min-height: 68px; }
  .login-form-side { padding: 22px 16px 32px; }
  .login-card__badge { margin-bottom: 16px; }
  .login-card h1 { font-size: 19px; }
}

/* ===== Tampilan publik (sebelum login): Peminjaman Ruang ===== */
.public-shell { min-height: 100vh; background: var(--color-bg); }
.public-header {
  display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap;
  padding: 14px 28px; background: linear-gradient(120deg, var(--color-maroon), var(--color-maroon-dark));
  position: sticky; top: 0; z-index: 20; box-shadow: var(--shadow-md);
}
.public-header__brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.public-header__title { font-weight: 700; font-size: 15.5px; color: #fff; line-height: 1.25; }
.public-header__subtitle { font-size: 11px; color: rgba(255,255,255,0.72); }
.public-header__right { display: flex; align-items: center; gap: 14px; }
.public-header .btn-primary { background: var(--color-gold); color: #3a2c05; flex-shrink: 0; }
.public-header .btn-primary:hover { background: #ddb833; }
.public-clock { text-align: right; color: #fff; line-height: 1.25; }
.public-clock__time { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
.public-clock__date { font-size: 10.5px; color: rgba(255,255,255,0.72); text-transform: capitalize; }
.public-content { max-width: 1800px; margin: 0 auto; padding: 0 40px 32px; }
@media (min-width: 1600px) {
  .public-content { padding: 0 64px 36px; }
}

/* --- Hero --- */
.public-hero {
  background: linear-gradient(150deg, var(--color-maroon) 0%, var(--color-maroon-dark) 62%, #3d0c17 100%);
  margin: 0 -40px 24px; padding: 34px 40px 26px; color: #fff; position: relative; overflow: hidden;
}
@media (min-width: 1600px) {
  .public-hero { margin: 0 -64px 24px; padding: 40px 64px 30px; }
}
.public-hero::before {
  content: ''; position: absolute; right: -60px; top: -60px; width: 260px; height: 260px; border-radius: 50%;
  background: radial-gradient(circle, rgba(201,162,39,0.22), transparent 70%);
}
.public-hero__inner { max-width: 1152px; margin: 0 auto; position: relative; }
.public-hero__eyebrow {
  display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--color-gold); background: rgba(201,162,39,0.14); border: 1px solid rgba(201,162,39,0.35);
  padding: 4px 10px; border-radius: 999px; margin-bottom: 14px;
}
.public-hero h1 { font-size: clamp(22px, 4vw, 32px); font-weight: 800; letter-spacing: -0.01em; margin: 0 0 8px; max-width: 20ch; }
.public-hero p { font-size: 13.5px; color: rgba(255,255,255,0.82); max-width: 56ch; margin: 0 0 22px; }

.public-hero__eyebrow { position: relative; }
.live-dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #34d399; margin-left: 2px;
  box-shadow: 0 0 0 0 rgba(52,211,153,0.6); animation: liveDotPulse 2s ease-in-out infinite;
}
@keyframes liveDotPulse {
  0% { box-shadow: 0 0 0 0 rgba(52,211,153,0.55); }
  70% { box-shadow: 0 0 0 6px rgba(52,211,153,0); }
  100% { box-shadow: 0 0 0 0 rgba(52,211,153,0); }
}

.hero-chip-group { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
.hero-chip {
  font-size: 11px; font-weight: 700; padding: 5px 13px; border-radius: 999px; background: rgba(255,255,255,0.08);
  color: rgba(255,255,255,0.78); border: 1px solid rgba(255,255,255,0.18);
}
.hero-chip:hover { background: rgba(255,255,255,0.16); color: #fff; }
.hero-chip.active { background: var(--color-gold); color: #3a2c05; border-color: var(--color-gold); }

/* --- Status ruangan sekarang (elemen ciri khas, interaktif) --- */
.room-status-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.room-status-card {
  position: relative; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.14); border-radius: var(--radius-md);
  padding: 12px 14px 12px 17px; backdrop-filter: blur(2px); text-align: left; width: 100%; font-family: inherit;
  cursor: pointer; transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  animation: roomCardIn 0.45s ease both; appearance: none; -webkit-appearance: none; color: inherit; overflow: hidden;
}
.room-status-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px;
}
.room-status-card.is-kosong::before { background: #22c55e; }
.room-status-card.is-dipakai::before { background: #ef4444; }
.room-status-card:hover { transform: translateY(-3px); background: rgba(255,255,255,0.13); border-color: rgba(201,162,39,0.5); }
.room-status-card:active { transform: translateY(-1px); }
.room-status-card:focus-visible { outline: 2px solid var(--color-gold); outline-offset: 2px; }
@keyframes roomCardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@media (prefers-reduced-motion: reduce) {
  .room-status-card { animation: none; }
  .live-dot { animation: none; }
}
.room-status-card__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
.room-status-card__name { font-size: 12.5px; font-weight: 700; color: #fff; line-height: 1.3; }
.room-status-badge {
  flex-shrink: 0; font-size: 10px; font-weight: 800; letter-spacing: 0.02em; padding: 3px 9px; border-radius: 999px; color: #fff;
}
.room-status-badge.kosong { background: #22c55e; }
.room-status-badge.dipakai { background: #ef4444; }
.room-status-card__info { font-size: 11px; color: rgba(255,255,255,0.75); }
.room-status-card__info.kosong { color: #86efac; }
.room-status-progress { height: 4px; border-radius: 999px; background: rgba(255,255,255,0.16); margin-top: 9px; overflow: hidden; }
.room-status-progress__fill { height: 100%; border-radius: 999px; background: #ef4444; }
.room-status-card__cta {
  display: block; font-size: 10.5px; font-weight: 700; color: var(--color-gold); margin-top: 9px; opacity: 0;
  transform: translateX(-4px); transition: opacity 0.15s ease, transform 0.15s ease;
}
.room-status-card:hover .room-status-card__cta, .room-status-card:focus-visible .room-status-card__cta { opacity: 1; transform: translateX(0); }
.room-status-empty { grid-column: 1 / -1; font-size: 12px; color: rgba(255,255,255,0.65); padding: 10px 2px; }

/* --- Strip pengenalan sistem (3 langkah) --- */
.intro-steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 22px 0; }
.intro-step { display: flex; align-items: flex-start; gap: 12px; }
.intro-step__icon {
  width: 38px; height: 38px; border-radius: 10px; background: var(--color-primary-soft); color: var(--color-primary-dark);
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.intro-step__title { font-size: 12.5px; font-weight: 700; margin-bottom: 2px; }
.intro-step__desc { font-size: 11.5px; color: var(--color-text-muted); line-height: 1.4; }

@media (max-width: 860px) {
  .intro-steps { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 700px) {
  .public-header { padding: 12px 16px; }
  .public-header__subtitle { display: none; }
  .public-clock__date { display: none; }
  .public-content { padding: 0 14px 20px; }
  .public-hero { margin: 0 -14px 18px; padding: 22px 14px 20px; }
  .public-hero p { margin-bottom: 18px; }
  .room-status-strip { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .intro-steps { grid-template-columns: 1fr; gap: 12px; margin: 18px 0; }
}

/* ===== Modal ===== */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(20,20,43,0.4); z-index: 200;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.modal-card {
  width: 100%; max-width: 480px; background: var(--color-surface); border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg); padding: 24px; max-height: 86vh; overflow-y: auto;
}
.modal-card__header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
.modal-close-btn { flex-shrink: 0; }
.detail-row { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--color-border); font-size: 13px; }
.detail-row:last-child { border-bottom: none; }
.detail-row span:first-child { color: var(--color-text-muted); }
.detail-row span:last-child { font-weight: 600; text-align: right; }
.row-link { color: var(--color-primary-dark); font-weight: 600; font-size: 12.5px; }

/* ===== Tab bar (mis. Kenaikan Pangkat: Pengajuan vs Kandidat) ===== */
.tab-bar { display: flex; gap: 6px; border-bottom: 1px solid var(--color-border); margin-bottom: 18px; flex-wrap: wrap; }
.tab-btn {
  display: inline-flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer;
  padding: 10px 4px; margin-right: 18px; font-size: 13.5px; font-weight: 600; color: var(--color-text-muted);
  border-bottom: 2px solid transparent; transition: color .15s, border-color .15s;
}
.tab-btn:hover { color: var(--color-text); }
.tab-btn.active { color: var(--color-primary-dark); border-bottom-color: var(--color-primary-dark); }

/* ===== Modal lebar (dipakai formulir Acara Pelantikan & Generator Berkas) ===== */
.modal-card--wide { max-width: 880px; }

/* ===== Berkas Persiapan Pelantikan ===== */
.acara-card {
  background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius-lg);
  padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow-sm);
}
.acara-card__head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.acara-card__title { font-size: 15px; font-weight: 700; margin: 0 0 4px; }
.acara-card__meta { font-size: 12.5px; color: var(--color-text-muted); display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 6px; }
.acara-card__peserta { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.peserta-chip {
  background: var(--color-primary-soft); color: var(--color-primary-dark); font-size: 11.5px; font-weight: 600;
  padding: 4px 10px; border-radius: 999px;
}
.peserta-row {
  display: grid; grid-template-columns: 1.2fr 1fr 0.75fr 0.85fr 1fr 0.95fr 0.85fr 0.85fr auto; gap: 8px; align-items: center;
  padding: 8px 0; border-bottom: 1px dashed var(--color-border);
}
.peserta-row--head { font-size: 10.5px; font-weight: 700; color: var(--color-text-faint); text-transform: uppercase; letter-spacing: .02em; padding-bottom: 6px; }
.peserta-row:last-child { border-bottom: none; }
@media (max-width: 900px) { .peserta-row { grid-template-columns: 1fr; } .peserta-row--head { display: none; } }
.berkas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 14px; }
.berkas-item {
  border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: 14px;
  display: flex; flex-direction: column; gap: 8px; background: var(--color-bg);
}
.berkas-item__num {
  width: 26px; height: 26px; border-radius: 50%; background: var(--color-primary); color: #fff;
  font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center;
}
.berkas-item__title { font-size: 13px; font-weight: 700; margin: 0; }
.berkas-item__desc { font-size: 11.5px; color: var(--color-text-muted); flex: 1; margin: 0; }

/* ===== Pratinjau berkas (sebelum unduh .docx) ===== */
.preview-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px 20px; }
.preview-fields__row { display: flex; flex-direction: column; gap: 2px; padding-bottom: 8px; border-bottom: 1px dashed var(--color-border); }
.preview-fields__label { font-size: 11px; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .02em; }
.preview-fields__value { font-size: 13px; color: var(--color-text); word-break: break-word; }

/* ===== Pratinjau visual halaman dokumen (mendekati tampilan asli file Word) ===== */
.doc-preview-wrap { background: var(--color-bg); border-radius: var(--radius-md); padding: 18px; margin-bottom: 16px; overflow-x: auto; }
.doc-preview-pager { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 14px; font-size: 12.5px; font-weight: 600; color: var(--color-text-muted); }
.doc-preview-pager button { display: flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--color-border); background: var(--color-surface); color: var(--color-text); cursor: pointer; transition: background .15s ease, transform .1s ease; }
.doc-preview-pager button:hover:not(:disabled) { background: var(--color-primary-soft); border-color: var(--color-primary); }
.doc-preview-pager button:active:not(:disabled) { transform: scale(0.92); }
.doc-preview-pager button:disabled { opacity: .35; cursor: not-allowed; }
.doc-preview-page {
  background: #fff; color: #161616; font-family: Arial, Helvetica, sans-serif; font-size: 11.5px; line-height: 1.55;
  width: 100%; max-width: 660px; margin: 0 auto; padding: 34px 38px; box-shadow: var(--shadow-lg);
  border-radius: 3px; box-sizing: border-box; animation: dashFadeUp .35s ease both;
}
@media (max-width: 560px) { .doc-preview-page { padding: 22px 18px; font-size: 10.5px; } }
.doc-preview-kop { display: flex; align-items: center; gap: 12px; }
.doc-preview-kop__logo { width: 50px; height: 55px; object-fit: contain; flex-shrink: 0; }
.doc-preview-kop__text { flex: 1; text-align: center; }
.doc-preview-kop__text .b1 { font-weight: 700; font-size: 12.5px; margin: 0 0 1px; }
.doc-preview-kop__text .b2 { font-weight: 400; font-size: 12.5px; margin: 0 0 1px; }
.doc-preview-kop__text .b3 { font-weight: 700; font-size: 13px; margin: 0 0 3px; }
.doc-preview-kop__text .addr { font-size: 8.5px; color: #222; margin: 0; }
.doc-preview-hr { border: none; border-top: 2.5px solid #161616; margin: 8px 0 16px; }
.doc-preview-logo-solo { display: flex; justify-content: center; margin-bottom: 12px; }
.doc-preview-logo-solo img { width: 34px; height: 37px; object-fit: contain; }
.doc-preview-title { text-align: center; font-weight: 700; text-transform: uppercase; margin: 0 0 3px; font-size: 12.5px; }
.doc-preview-p { margin: 0 0 9px; text-align: justify; }
.doc-preview-p.center { text-align: center; }
.doc-preview-p.right { text-align: right; }
.doc-preview-p.left { text-align: left; }
.doc-preview-p.bold { font-weight: 700; }
.doc-preview-label-row { display: flex; gap: 6px; margin: 0 0 3px; padding-left: 18px; }
.doc-preview-label-row .lbl { flex: 0 0 128px; white-space: pre; }
.doc-preview-space { display: block; }
.doc-preview-sign { text-align: right; margin-top: 14px; }
.doc-preview-sign .gap { height: 34px; }
.doc-preview-table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; font-size: 10.5px; }
.doc-preview-table th, .doc-preview-table td { border: 1px solid #333; padding: 4px 6px; text-align: left; vertical-align: top; }
.doc-preview-table th { text-align: center; font-weight: 700; background: #f2f2f2; }
.doc-preview-cover { border: 2px solid #161616; display: flex; align-items: center; gap: 16px; padding: 22px; }
.doc-preview-cover img { width: 64px; height: 70px; object-fit: contain; flex-shrink: 0; }
.doc-preview-cover .txt { flex: 1; text-align: center; font-weight: 700; font-size: 13px; }
.doc-preview-note { font-size: 11px; color: var(--color-text-faint); text-align: center; margin-top: 10px; }

/* ===== Kalender jadwal ruang (ala jadwal piket) ===== */
.jadwal-piket th { text-align: center; white-space: nowrap; }
.jadwal-piket-cell { min-width: 108px; vertical-align: top; padding: 6px !important; cursor: pointer; }
.jadwal-piket-cell:hover { background: var(--color-primary-soft); }
.jadwal-piket-cell--readonly { cursor: default; }
.jadwal-piket-cell--readonly:hover { background: transparent; }
.jadwal-piket-tag {
  background: var(--color-primary-soft); color: var(--color-primary-dark); border-radius: 8px;
  padding: 4px 6px; font-size: 11px; margin-bottom: 4px; line-height: 1.35; text-align: left;
}
.jadwal-piket-tag strong { display: block; font-size: 11px; }
.jadwal-piket-kosong { display: block; text-align: center; color: var(--color-text-faint); font-size: 13px; }
@media (max-width: 900px) {
  .jadwal-piket-cell { min-width: 84px; }
}

/* ===== Tombol aksi hijau (mis. Kelola/Edit di tabel) ===== */
.btn-action-green {
  display: inline-flex; align-items: center; gap: 5px; background: var(--color-success-soft);
  color: var(--color-success); border: 1px solid transparent; border-radius: 999px;
  padding: 5px 11px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background .15s;
}
.btn-action-green:hover { background: #C9F2DA; }
.btn-action-red {
  display: inline-flex; align-items: center; gap: 5px; background: var(--color-danger-soft);
  color: var(--color-danger); border: 1px solid transparent; border-radius: 999px;
  padding: 5px 9px; font-size: 12px; font-weight: 700; cursor: pointer; transition: background .15s;
}

.input-angka {
  width: 56px; padding: 5px 6px; border: 1px solid var(--color-border); border-radius: 6px;
  font-size: 12.5px; text-align: center; font-family: inherit; color: var(--color-text);
}
.input-angka:focus { outline: 2px solid var(--color-primary); outline-offset: 1px; border-color: transparent; }

.input-keterangan {
  width: 140px; padding: 5px 8px; border: 1px solid var(--color-border); border-radius: 6px;
  font-size: 12px; font-family: inherit; color: var(--color-text);
}
.input-keterangan:focus { outline: 2px solid var(--color-primary); outline-offset: 1px; border-color: transparent; }
.btn-action-red:hover { background: #FBD5D5; }

/* ===== Tabel responsif ala kartu di layar sempit ===== */
@media (max-width: 700px) {
  .data-table thead { display: none; }
  .data-table, .data-table tbody, .data-table tr, .data-table td { display: block; width: 100%; }
  .data-table { border: none; }
  .data-table tr { border: 1px solid var(--color-border); border-radius: 12px; margin-bottom: 10px; padding: 4px 14px; background: var(--color-surface); }
  .data-table td { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--color-border); text-align: right; }
  .data-table td:last-child { border-bottom: none; }
  .data-table td::before { content: attr(data-label); font-size: 11.5px; font-weight: 700; color: var(--color-text-faint); text-align: left; text-transform: uppercase; letter-spacing: .02em; }
  .data-table td:empty::before { content: none; }
  .table-wrap { overflow-x: visible; }
  .filter-bar { flex-direction: column; align-items: stretch; }
  .filter-bar .select-filter { width: 100%; }
  .page-header { flex-direction: column; align-items: stretch; }
  .page-header > div:last-child { display: flex; flex-direction: column; }

  /* Kalender jadwal ruang tetap berupa grid (discroll), bukan kartu bertumpuk */
  .jadwal-piket, .jadwal-piket thead, .jadwal-piket tbody, .jadwal-piket tr, .jadwal-piket th, .jadwal-piket td {
    display: revert; width: revert;
  }
  .jadwal-piket tr { border: none; margin-bottom: 0; padding: 0; }
  .jadwal-piket td { display: table-cell; text-align: left; border-bottom: 1px solid var(--color-border); }
  .jadwal-piket td::before { content: none; }
  .jadwal-piket { border-collapse: collapse; }
  table.jadwal-piket ~ .table-wrap, .table-wrap:has(.jadwal-piket) { overflow-x: auto; }
}

/* ===== Cetak SK (print) ===== */
.printable-sk { display: none; }
@media print {
  body * { visibility: hidden; }
  .printable-sk, .printable-sk * { visibility: visible; }
  .printable-sk { display: block; position: absolute; top: 0; left: 0; width: 100%; padding: 30px; }
}

  function waktuRelatif(ts) {
    const detik = Math.floor((Date.now() - ts) / 1000);
    if (detik < 10) return 'Baru saja';
    if (detik < 60) return `${detik} detik lalu`;
    const menit = Math.floor(detik / 60);
    if (menit < 60) return `${menit} menit lalu`;
    const jam = Math.floor(menit / 60);
    if (jam < 24) return `${jam} jam lalu`;
    const hari = Math.floor(jam / 24);
    if (hari < 7) return `${hari} hari lalu`;
    return new Date(ts).toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric' });
  }

  // Menentukan TMT dasar perhitungan gol./gaji seorang pegawai: pakai TMT Pangkat Terakhir bila
  // sudah diisi admin (paling akurat), jika belum ada maka jatuh ke TMT CPNS yang terbaca dari
  // NIP (digit ke-9 s.d. 14, format YYYYMM) sebagai estimasi awal. Cth. NIP 199512312019012001
  // -> digit 9-14 = "201901" -> TMT CPNS Januari 2019.
  function tmtDasarPegawai(p) {
    if (p.tmtPangkat) return { tanggal: p.tmtPangkat, sumber: 'manual' };
    const info = parseNIP(p.nip);
    if (info && info.tmtCPNS) {
      const [bulan, tahun] = info.tmtCPNS.split('-');
      if (bulan && tahun) return { tanggal: `${tahun}-${bulan}-01`, sumber: 'nip' };
    }
    return null;

  function namaHari(tanggal) {

  // Mengurai teks "jadwal jam" bebas dari spreadsheet (mis. "08:00-10:00", "08.00 s/d 10.00")
  // menjadi jam mulai & selesai berformat HH:MM agar bisa dipakai deteksi tabrakan jadwal.
  function uraiJadwalJam(teks) {
    const t = String(teks || '').replace(/\./g, ':').replace(/\s*s\/?d\s*/i, '-').trim();
    const m = t.match(/(\d{1,2}:\d{2})\s*[-–]\s*(\d{1,2}:\d{2})/);
    if (!m) return { jamMulai: '', jamSelesai: '', label: teks || '' };
    const pad = (s) => s.split(':').map((x, i) => (i === 0 ? x.padStart(2, '0') : x)).join(':');
    return { jamMulai: pad(m[1]), jamSelesai: pad(m[2]), label: `${pad(m[1])}\u2013${pad(m[2])}` };
  }

  // Mengurai tanggal dari spreadsheet ke format YYYY-MM-DD, menerima format umum
  // "DD/MM/YYYY", "DD-MM-YYYY", maupun "YYYY-MM-DD" yang sudah baku.
  function uraiTanggal(teks) {
    const t = String(teks || '').trim();
    if (/^\d{4}-\d{2}-\d{2}$/.test(t)) return t;
    const m = t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/);
    if (m) return `${m[3]}-${m[2].padStart(2, '0')}-${m[1].padStart(2, '0')}`;
    return t;
  }

  // Cek tabrakan jadwal: ruangan sama + tanggal sama + rentang jam beririsan.
  function cekTabrakanJadwal(daftar, calon, idKecuali) {
    return daftar.find((b) => {
      if (idKecuali && b.id === idKecuali) return false;
      if (b.ruangan !== calon.ruangan || b.tanggal !== calon.tanggal) return false;
      if (!b.jamMulai || !b.jamSelesai) return false;
      return calon.jamMulai < b.jamSelesai && calon.jamSelesai > b.jamMulai;
    }) || null;
  }

  function unduhCSV(namaFile, header, rows) {
    const escapeCsv = (v) => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
    const isi = [header.map(escapeCsv).join(',')].concat(rows.map((r) => r.map(escapeCsv).join(','))).join('\r\n');
    const blob = new Blob(['\uFEFF' + isi], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = namaFile;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Kirim satu baris ke Google Sheets via Apps Script Web App, jika URL-nya sudah dikonfigurasi.
  // Tidak melempar error ke pengguna bila gagal/tidak dikonfigurasi — penyimpanan lokal tetap jalan.
  async function sinkronKeSheet(webhookUrl, payload) {
    if (!webhookUrl) return false;
    try {
      await fetch(webhookUrl, {
        method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(payload),

    } catch (err) {

    };

  function parseCSV(text, headerMapFn) {
    const mapFn = headerMapFn || normalisasiHeader;
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else inQuotes = false;
        } else field += c;
      } else if (c === '"') {
        inQuotes = true;
      } else if (c === ',' || c === ';') {
        row.push(field); field = '';
      } else if (c === '\n') {
        row.push(field); rows.push(row); row = []; field = '';
      } else if (c === '\r') {
        // abaikan
      } else {
        field += c;
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }

    const cleaned = rows.filter((r) => r.some((v) => v.trim() !== ''));
    if (!cleaned.length) return [];

    const header = cleaned[0].map(mapFn);
    return cleaned.slice(1).map((r) => {
      const obj = {};
      header.forEach((h, idx) => { obj[h] = (r[idx] ?? '').trim(); });
      return obj;
    });
  }

  function normalisasiHeaderUangMakan(h) {
    const key = h.trim().toLowerCase();
    const map = {
      nip: 'nip', nama: 'nama', 'nama pegawai': 'nama',
      cuti: 'cuti', 'hari cuti': 'cuti',
      dl: 'dl', 'dinas luar': 'dl', 'hari dl': 'dl',
      sakit: 'sakit', 'hari sakit': 'sakit',
      tk: 'tk', 'tanpa keterangan': 'tk', 'alpa': 'tk', 'hari tk': 'tk',
      keterangan: 'keterangan', catatan: 'keterangan', 'tgl cuti': 'keterangan', 'tanggal cuti': 'keterangan',
    };
    return map[key] || key;
  }

  function normalisasiBarisUangMakan(obj) {
    const angka = (v) => (v === '' || v === undefined ? 0 : Math.max(0, Number(v) || 0));
    return {
      nip: (obj.nip || '').replace(/\s+/g, ''),
      nama: (obj.nama || '').trim(),
      cuti: angka(obj.cuti), dl: angka(obj.dl), sakit: angka(obj.sakit), tk: angka(obj.tk),
      keterangan: (obj.keterangan || '').trim(),
    };
  }

  function normalisasiBarisPegawai(obj) {
    return {
      nama: obj.nama || '(tanpa nama)',
      nip: obj.nip || '-',
      jabatan: obj.jabatan || '-',
      golongan: obj.golongan || '-',
      unit: obj.unit || '-',
      status: obj.status || 'Aktif',
      tmtPangkat: obj.tmtPangkat || '',
      besaranPAK: obj.besaranPAK || '',
      folderPAK: obj.folderPAK || '',
    };
  }

  // Menarik data terbaru langsung dari Google Sheets publik (tanpa API key/OAuth) lewat endpoint
  // CSV gviz. Hanya berfungsi bila sheet dibagikan "Anyone with the link can view". Dipakai untuk
  // menjaga data pegawai & jadwal ruang tetap sinkron dengan spreadsheet sumber (bukan salinan
  // statis yang bisa basi begitu ada perubahan/penambahan baris di spreadsheet aslinya).
  async function fetchSheetCSV(sheetId, sheetName, headerMapFn) {
    const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:csv${sheetName ? `&sheet=${encodeURIComponent(sheetName)}` : ''}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Gagal mengambil spreadsheet (HTTP ${res.status})`);
    const text = await res.text();
    return parseCSV(text, headerMapFn);
  }

  /* ============================== ATURAN KENAIKAN PANGKAT (BKN) ============================== */
  // Dasar hukum: Peraturan BKN No. 4 Tahun 2025 tentang Periodisasi Kenaikan Pangkat PNS
  // (berlaku efektif 1 Oktober 2025, mencabut Peraturan BKN No. 4/2023) — usul kenaikan
  // pangkat kini dibuka 12 kali setahun, setiap tanggal 1 tiap bulan.
  // Syarat kepangkatan: reguler (non-fungsional) min. 4 tahun dalam pangkat terakhir;
  // pilihan/jabatan fungsional tertentu min. 2 tahun dalam pangkat terakhir + Angka Kredit
  // kumulatif terpenuhi + SKP/penilaian kinerja bernilai baik 2 tahun terakhir
  // (ref. PP 11/2017 jo. PP 17/2020, Permenpan RB No. 1/2023 tentang Jabatan Fungsional).
  const SYARAT_TAHUN_FUNGSIONAL = 2;
  const SYARAT_TAHUN_REGULER = 4;
  const KATA_KUNCI_STRUKTURAL = ['kepala kantor', 'kepala divisi', 'kepala bidang', 'kepala bagian', 'kepala sub'];
  // Jenjang jabatan fungsional resmi (Ahli: pertama/muda/madya/utama; Keterampilan: pemula/terampil/mahir/penyelia).
  // Jabatan tanpa kata kepala & tanpa jenjang ini digolongkan Pelaksana (staf administrasi/teknis umum).
  const JENJANG_FUNGSIONAL = ['pertama', 'muda', 'madya', 'utama', 'penyelia', 'mahir', 'terampil', 'pemula'];

  function jenisKepegawaian(jabatan) {
    const j = (jabatan || '').toLowerCase();
    if (KATA_KUNCI_STRUKTURAL.some((k) => j.includes(k))) return 'Struktural';
    if (JENJANG_FUNGSIONAL.some((k) => new RegExp(`\\b${k}\\b`).test(j))) return 'Fungsional';
    return 'Pelaksana';
  }

  function parseNIP(nip) {
    const digits = String(nip || '').replace(/\D/g, '');
    if (digits.length < 18) return null;
    const lahir = digits.slice(0, 8);
    const tmtCPNS = digits.slice(8, 14);
    const genderDigit = digits.slice(14, 15);
    return {
      tanggalLahir: `${lahir.slice(6, 8)}-${lahir.slice(4, 6)}-${lahir.slice(0, 4)}`,
      tmtCPNS: `${tmtCPNS.slice(4, 6)}-${tmtCPNS.slice(0, 4)}`,
      jenisKelamin: genderDigit === '1' ? 'Laki-laki' : genderDigit === '2' ? 'Perempuan' : '-',
    };
  }

  function hitungTahunSelisih(tanggalMulai) {
    const mulai = new Date(tanggalMulai);
    if (isNaN(mulai.getTime())) return null;
    const sekarang = new Date();
    let tahun = sekarang.getFullYear() - mulai.getFullYear();
    const belumUlangTahun =
      sekarang.getMonth() < mulai.getMonth() || (sekarang.getMonth() === mulai.getMonth() && sekarang.getDate() < mulai.getDate());
    if (belumUlangTahun) tahun -= 1;
    return tahun;
  }

  // Selisih presisi tahun+bulan antara dua tanggal, format sesuai SK asli ("X Tahun Y Bulan").
  function hitungTahunBulanSelisih(tanggalMulai, tanggalAcuan) {
    const mulai = new Date(tanggalMulai);
    const acuan = tanggalAcuan ? new Date(tanggalAcuan) : new Date();
    if (isNaN(mulai.getTime()) || isNaN(acuan.getTime())) return null;
    let bulanTotal = (acuan.getFullYear() - mulai.getFullYear()) * 12 + (acuan.getMonth() - mulai.getMonth());
    if (acuan.getDate() < mulai.getDate()) bulanTotal -= 1;
    if (bulanTotal < 0) bulanTotal = 0;
    return { tahun: Math.floor(bulanTotal / 12), bulan: bulanTotal % 12 };
  }
  function formatTahunBulan(tb) {
    if (!tb) return '-';
    return `${tb.tahun} Tahun ${tb.bulan} Bulan`;
  }

  // Konversi angka ke terbilang Bahasa Indonesia, dipakai untuk redaksi "(... Rupiah)" pada SK,
  // meniru gaya penulisan pada contoh SK Kenaikan Gaji Berkala resmi.
  function angkaKeTerbilang(n) {
    const satuan = ['', 'Satu', 'Dua', 'Tiga', 'Empat', 'Lima', 'Enam', 'Tujuh', 'Delapan', 'Sembilan', 'Sepuluh', 'Sebelas'];
    function eja(num) {
      if (num < 12) return satuan[num];
      if (num < 20) return `${eja(num - 10)} Belas`;
      if (num < 100) return `${satuan[Math.floor(num / 10)]} Puluh${num % 10 ? ' ' + eja(num % 10) : ''}`;
      if (num < 200) return `Seratus${num % 100 ? ' ' + eja(num % 100) : ''}`;
      if (num < 1000) return `${satuan[Math.floor(num / 100)]} Ratus${num % 100 ? ' ' + eja(num % 100) : ''}`;
      if (num < 2000) return `Seribu${num % 1000 ? ' ' + eja(num % 1000) : ''}`;
      if (num < 1000000) return `${eja(Math.floor(num / 1000))} Ribu${num % 1000 ? ' ' + eja(num % 1000) : ''}`;
      if (num < 1000000000) return `${eja(Math.floor(num / 1000000))} Juta${num % 1000000 ? ' ' + eja(num % 1000000) : ''}`;
      return String(num);
    }
    const bulat = Math.round(Math.abs(n));
    if (bulat === 0) return 'Nol Rupiah';
    return `${eja(bulat)} Rupiah`.replace(/\s+/g, ' ').trim();
  }

  function periodeUsulTerdekat() {
    const now = new Date();
    const bulanDepan = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    return bulanDepan.toLocaleDateString('id-ID', { day: '2-digit', month: 'long', year: 'numeric' });
  }

  function kelayakanPangkat(p) {
    const jenis = jenisKepegawaian(p.jabatan);
    const syarat = jenis === 'Fungsional' ? SYARAT_TAHUN_FUNGSIONAL : SYARAT_TAHUN_REGULER;
    const dasar = tmtDasarPegawai(p);
    if (!dasar) return { jenis, syarat, masaKerja: null, status: 'Data Belum Lengkap', sumberTMT: null };
    const masaKerja = hitungTahunSelisih(dasar.tanggal);
    if (masaKerja === null) return { jenis, syarat, masaKerja: null, status: 'Data Belum Lengkap', sumberTMT: null };
    return { jenis, syarat, masaKerja, status: masaKerja >= syarat ? 'Siap Diusulkan' : 'Belum Memenuhi', sumberTMT: dasar.sumber };
  }

  /* ============================== GAJI POKOK & KENAIKAN GAJI BERKALA (KGB) ============================== */
  // Dasar hukum: Peraturan Pemerintah No. 5 Tahun 2024 tentang Perubahan Kesembilan Belas atas
  // PP No. 7 Tahun 1977 tentang Peraturan Gaji PNS (berlaku 1 Januari 2024, masih berlaku per
  // pengecekan terakhir Juli 2026 — belum ada PP pengganti). Nilai MKG 0 & MKG 32 diambil dari
  // lampiran resmi PP 5/2024; nilai di antaranya (MKG 2 s.d. 30) diinterpolasi linear per rentang
  // 2 tahun karena aplikasi ini tidak menyimpan seluruh 17 baris tabel resmi per golongan.
  // Kenaikan Gaji Berkala (KGB) diberikan otomatis tiap 2 tahun sekali (PP No. 7/1977 jo. PP 5/2024)
  // selama penilaian kinerja/SKP minimal bernilai "baik", terhitung sejak TMT golongan terakhir.
  const TABEL_GAJI_POKOK = {
    'I/a': [1685700, 2522600], 'I/b': [1840800, 2670700], 'I/c': [1918700, 2783700], 'I/d': [1999900, 2901400],
    'II/a': [2184000, 3516900], 'II/b': [2385000, 3797500], 'II/c': [2487900, 3958200], 'II/d': [2591100, 4125600],
    'III/a': [2785700, 4554500], 'III/b': [2903600, 4768800], 'III/c': [3026400, 4960900], 'III/d': [3154400, 5180700],
    'IV/a': [3287800, 5399900], 'IV/b': [3426900, 5628300], 'IV/c': [3571900, 5866400], 'IV/d': [3723000, 6114500], 'IV/e': [3880400, 6373200],
  };
  const KGB_TAHUN = 2;

  // Tarif Uang Makan PNS — PMK No. 32 Tahun 2025 tentang Standar Biaya Masukan (SBM) TA 2026.
  // Bisa disesuaikan manual per baris di halaman Uang Makan bila ada revisi PMK berikutnya.
  const TARIF_UANG_MAKAN = { I: 35000, II: 35000, III: 37000, IV: 41000 };
  const STORAGE_KEY_UANG_MAKAN = 'simpatik_uang_makan_v1';

  function tierGolongan(golongan) {
    const romawi = String(golongan || '').split('/')[0].trim().toUpperCase();
    return TARIF_UANG_MAKAN[romawi] !== undefined ? romawi : null;
  }

  function tarifUangMakan(golongan) {
    const tier = tierGolongan(golongan);
    return tier ? TARIF_UANG_MAKAN[tier] : 0;
  }

  function muatUangMakan() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY_UANG_MAKAN) || '{}');
      return raw && typeof raw === 'object' ? raw : {};
    } catch (err) {
      return {};
    }
  }

  function simpanUangMakan(semua) {
    localStorage.setItem(STORAGE_KEY_UANG_MAKAN, JSON.stringify(semua));
  }

  function bulanIniYYYYMM() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
  }

  function labelBulan(yyyymm) {
    const [y, m] = yyyymm.split('-').map(Number);
    return new Date(y, m - 1, 1).toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });
  }

  function formatRupiah(angka) {
    if (angka === null || angka === undefined || isNaN(angka)) return '-';
    return 'Rp' + Math.round(angka).toLocaleString('id-ID');
  }

  function estimasiGajiPokok(golongan, masaKerjaGolongan) {
    const rentang = TABEL_GAJI_POKOK[golongan];
    if (!rentang || masaKerjaGolongan === null || masaKerjaGolongan === undefined) return null;
    const mkg = Math.max(0, Math.min(32, Math.floor(masaKerjaGolongan / 2) * 2));
    const [min, max] = rentang;
    const nilai = min + (max - min) * (mkg / 32);
    return Math.round(nilai / 100) * 100;
  }

  function infoGajiBerkala(p) {
    const dasar = tmtDasarPegawai(p);
    const masaKerja = dasar ? hitungTahunSelisih(dasar.tanggal) : null;
    const gajiSaatIni = masaKerja === null ? null : estimasiGajiPokok(p.golongan, masaKerja);
    if (!dasar || masaKerja === null) {
      return { masaKerja: null, gajiSaatIni: null, gajiSetelahKGB: null, tmtKGBBerikutnya: null, kgbYad: null, masaKerjaDetail: null, status: 'Data Belum Lengkap', sumberTMT: null, tmtDasar: null };
    }
    const langkahKGBBerikutnya = (Math.floor(masaKerja / KGB_TAHUN) + 1) * KGB_TAHUN;
    const tmtAwal = new Date(dasar.tanggal);
    const tmtKGBBerikutnya = new Date(tmtAwal.getFullYear() + langkahKGBBerikutnya, tmtAwal.getMonth(), tmtAwal.getDate());
    const kgbYad = new Date(tmtKGBBerikutnya.getFullYear() + KGB_TAHUN, tmtKGBBerikutnya.getMonth(), tmtKGBBerikutnya.getDate());
    const gajiSetelahKGB = estimasiGajiPokok(p.golongan, langkahKGBBerikutnya);
    const masaKerjaDetail = hitungTahunBulanSelisih(dasar.tanggal, tmtKGBBerikutnya);
    const now = new Date();
    const jatuhTempoBulanIni = tmtKGBBerikutnya.getFullYear() === now.getFullYear() && tmtKGBBerikutnya.getMonth() === now.getMonth();
    const sudahLewat = tmtKGBBerikutnya < now;
    return {
      masaKerja, gajiSaatIni, gajiSetelahKGB, tmtKGBBerikutnya, kgbYad, masaKerjaDetail,
      status: sudahLewat ? 'Jatuh Tempo' : jatuhTempoBulanIni ? 'Jatuh Tempo' : 'Terjadwal',
      sumberTMT: dasar.sumber, tmtDasar: dasar.tanggal,
    };
  }

  // Jadwal KGB satu tahun penuh, dikelompokkan per bulan — dipakai untuk "Jadwal Bulanan" di
  // halaman Penggajian. Menghitung semua kelipatan KGB_TAHUN dari TMT dasar (manual atau NIP)
  // yang jatuh pada tahun tsb, bukan hanya KGB berikutnya seperti infoGajiBerkala().
  function jadwalKGBTahun(daftarPegawai, tahun) {
    const bulanMap = Array.from({ length: 12 }, () => []);
    daftarPegawai.forEach((p) => {
      const dasar = tmtDasarPegawai(p);
      if (!dasar) return;
      const tmtAwal = new Date(dasar.tanggal);
      if (isNaN(tmtAwal.getTime())) return;
      for (let k = 1; k <= 30; k++) {
        const langkah = k * KGB_TAHUN;
        const tgl = new Date(tmtAwal.getFullYear() + langkah, tmtAwal.getMonth(), tmtAwal.getDate());
        if (tgl.getFullYear() > tahun) break;
        if (tgl.getFullYear() === tahun) {
          bulanMap[tgl.getMonth()].push({ p, tanggal: tgl, gajiLama: estimasiGajiPokok(p.golongan, langkah - KGB_TAHUN), gajiBaru: estimasiGajiPokok(p.golongan, langkah), sumberTMT: dasar.sumber });
        }
      }
    });
    bulanMap.forEach((list) => list.sort((a, b) => a.tanggal - b.tanggal || a.p.nama.localeCompare(b.p.nama)));
    return bulanMap;
  }

  /* ============================== KOMPONEN KECIL ============================== */
  function Badge({ status }) {
    const cls = BADGE_CLASS[status] || 'badge-info';
    return e('span', { className: `badge ${cls}` }, status);
  }

  function AnimatedNumber({ value }) {
    const str = String(value == null ? '' : value);
    const match = str.match(/^(\D*)(\d+)(\D*)$/);
    const [tampil, setTampil] = useState(match ? 0 : str);
    useEffect(() => {
      if (!match) { setTampil(str); return; }
      const target = parseInt(match[2], 10);
      const durasi = 700;
      const mulai = performance.now();
      let frame;
      function tick(sekarang) {
        const t = Math.min(1, (sekarang - mulai) / durasi);
        const ease = 1 - Math.pow(1 - t, 3);
        setTampil(Math.round(target * ease));
        if (t < 1) frame = requestAnimationFrame(tick);
      }
      frame = requestAnimationFrame(tick);
      return () => cancelAnimationFrame(frame);
    }, [str]);
    if (!match) return e('span', null, tampil);
    return e('span', null, `${match[1]}${tampil}${match[3]}`);
  }

  function StatCard({ icon: IconComp, label, value, delta, direction = 'up', tone = 'primary', style }) {
    const toneMap = {
      primary: ['var(--color-primary-soft)', 'var(--color-primary-dark)', 'var(--color-primary)'],
      success: ['var(--color-success-soft)', 'var(--color-success)', 'var(--color-success)'],
      warning: ['var(--color-warning-soft)', 'var(--color-warning)', 'var(--color-warning)'],
      info: ['var(--color-info-soft)', 'var(--color-info)', 'var(--color-info)'],
    };
    const [bg, fg, accent] = toneMap[tone] || toneMap.primary;
    return e(
      'div',
      { className: 'card stat-card', style: { '--stat-accent': accent, ...style } },
      e(
        'div',
        { className: 'stat-card__top' },
        e('div', { className: 'stat-card__icon', style: { background: bg, color: fg } }, e(IconComp, { size: 19 })),
        delta &&
          e(
            'span',
            { className: `stat-card__delta ${direction}` },
            e(direction === 'up' ? IconArrowUp : IconArrowDown, { size: 13 }),
            delta
          )
      ),
      e('div', { className: 'stat-card__value' }, e(AnimatedNumber, { value })),
      e('div', { className: 'stat-card__label' }, label)
    );
  }

  function AvatarChip({ nama }) {
    return e('div', { className: 'avatar-chip' }, initials(nama));
  }

  /* ============================== FORM PEGAWAI (TAMBAH/EDIT) ============================== */
  function fieldStyle() {
    return { fontSize: 12.5, fontWeight: 600, display: 'block', marginBottom: 6 };
  }
  // Label field wajib diisi (dipakai di form Acara Pelantikan) -- tanda * merah supaya jelas
  // field mana saja yang harus terisi sebelum berkas pelantikan bisa dibuat/diunduh.
  function labelWajib(teks) {

  /* ============================== INPUT NAMA PEGAWAI YANG BISA DICARI (COMBOBOX) ==============================
     Dipakai di seluruh field "nama" pada fitur Persiapan Pelantikan (petugas, pejabat pelantik, peserta, dst)
     supaya bisa diketik bebas ATAU dicari & dipilih langsung dari Data Pegawai \u2014 lebih cepat & tidak salah ketik
     nama/gelar. Saat memilih dari daftar, onPilih(pegawai) dipanggil supaya field lain (NIP, golongan, jabatan)
     bisa ikut terisi otomatis oleh pemanggil. */
  function PegawaiSearchInput({ value, onChange, onPilih, pegawai, placeholder, required, autoFocus }) {
    const [buka, setBuka] = useState(false);
    const wrapRef = useRef(null);

    useEffect(() => {
      function tutupJikaDiluar(ev) {
        if (wrapRef.current && !wrapRef.current.contains(ev.target)) setBuka(false);
      }
      document.addEventListener('mousedown', tutupJikaDiluar);
      return () => document.removeEventListener('mousedown', tutupJikaDiluar);
    }, []);

    const q = (value || '').trim().toLowerCase();
    const daftar = pegawai || [];
    const hasil = (q ? daftar.filter((p) => p.nama.toLowerCase().includes(q)) : daftar).slice(0, 8);

    return e(
      'div', { className: 'pegawai-combo', ref: wrapRef },
      e(
        'div', { className: 'input-search' },
        e(IconSearch, { size: 14 }),
        e('input', {
          value: value || '',
          placeholder: placeholder || 'Ketik atau cari nama pegawai...',
          required, autoFocus,
          onChange: (ev) => { onChange(ev.target.value); setBuka(true); },
          onFocus: () => setBuka(true),
        })
      ),
      buka && hasil.length > 0 && e(
        'div', { className: 'pegawai-combo__panel' },
        hasil.map((p, i) => e(
          'button',
          {
            type: 'button', key: i, className: 'pegawai-combo__item',
            onMouseDown: (ev) => ev.preventDefault(),
            onClick: () => { onChange(p.nama); if (onPilih) onPilih(p); setBuka(false); },
          },
          e('span', { className: 'pegawai-combo__nama' }, p.nama),
          p.jabatan && e('span', { className: 'pegawai-combo__jabatan' }, p.jabatan)
        ))
      )
    );
  }

  function PegawaiForm({ initial, onClose, onSave }) {
    const kosong = { nama: '', nip: '', jabatan: '', golongan: '', unit: '', status: 'Aktif', tmtPangkat: '', besaranPAK: '', folderPAK: '' };

    function ubah(field, value) { setForm((f) => ({ ...f, [field]: value })); }

      ev.preventDefault();

    return e(

        'form',
        { onSubmit: handleSubmit },
        e(
          'div',

          e('div', null, e('label', { style: fieldStyle() }, 'NIP (18 digit)'), e('div', { className: 'input-search' }, e('input', { value: form.nip, onChange: (ev) => ubah('nip', ev.target.value), required: true, placeholder: '19900101 202001 1 001' }))),
          e('div', null, e('label', { style: fieldStyle() }, 'Jabatan'), e('div', { className: 'input-search' }, e('input', { value: form.jabatan, onChange: (ev) => ubah('jabatan', ev.target.value) }))),
          e('div', null, e('label', { style: fieldStyle() }, 'Golongan'), e('div', { className: 'input-search' }, e('input', { value: form.golongan, onChange: (ev) => ubah('golongan', ev.target.value), placeholder: 'III/a' }))),
          e('div', null, e('label', { style: fieldStyle() }, 'Unit Kerja'), e('div', { className: 'input-search' }, e('input', { value: form.unit, onChange: (ev) => ubah('unit', ev.target.value) }))),
          e(
            'div',

  function NotificationBell({ notifikasi, onBacaSemua, onHapusSemua }) {
    const [open, setOpen] = useState(false);
    const wrapRef = useRef(null);
    const belumDibaca = notifikasi.filter((n) => !n.dibaca).length;

    useEffect(() => {
      if (!open) return;
      function onClickLuar(ev) {
        if (wrapRef.current && !wrapRef.current.contains(ev.target)) setOpen(false);
      }
      document.addEventListener('mousedown', onClickLuar);
      return () => document.removeEventListener('mousedown', onClickLuar);
    }, [open]);

    function toggle() {
      setOpen((v) => {
        const next = !v;
        if (next && belumDibaca > 0) onBacaSemua();
        return next;
      });
    }

    return e(
      'div',
      { className: 'notif-wrap', ref: wrapRef },
      e(
        'button',
        { className: 'topbar-icon-btn', 'aria-label': 'Notifikasi', onClick: toggle },
        e(IconBell, { size: 16 }),
        belumDibaca > 0 && e('span', { className: 'dot' })
      ),
      open &&
        e(
          'div',
          { className: 'notif-panel' },
          e(
            'div',
            { className: 'notif-panel__head' },
            e('span', null, 'Notifikasi'),

        const cocokStatus = status === 'Semua' || p.status === status;
        return cocokQuery && cocokStatus;
      });
    }, [pegawai, query, status]);

    async function handleFile(ev) {
      const file = ev.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const rows = parseCSV(text).map(normalisasiBarisPegawai);
        if (!rows.length) { showToast('File tidak berisi data yang bisa dibaca.'); return; }
        onImport(rows);
        showToast(`Berhasil mengimpor ${rows.length} data pegawai.`);
      } catch (err) {
        showToast('Gagal membaca file. Pastikan formatnya CSV.');
      } finally {
        ev.target.value = '';
      }
    }

    async function handleSinkronSheet() {
      setSinkronBerjalan(true);
      try {
        const rowsBaru = (await fetchSheetCSV(SHEET_PEGAWAI_ID)).map(normalisasiBarisPegawai);
        if (!rowsBaru.length) { showToast('Spreadsheet kosong atau tidak bisa dibaca.'); return; }
        // Gabungkan dengan data lokal: nama/jabatan/golongan/unit/status ikut spreadsheet (sumber
        // utama), tapi TMT Pangkat, PAK, dan folder PAK yang sudah diisi admin di aplikasi ini
        // dipertahankan (tidak ada di kolom spreadsheet, jadi tidak boleh tertimpa kosong).
        const petaLama = {};
        pegawai.forEach((p) => { petaLama[p.nip] = p; });
        const gabungan = rowsBaru.map((r) => {
          const lama = petaLama[r.nip];
          return lama ? { ...r, tmtPangkat: lama.tmtPangkat, besaranPAK: lama.besaranPAK, folderPAK: lama.folderPAK } : r;
        });
        onImport(gabungan);
        showToast(`Sinkron berhasil \u2014 ${gabungan.length} pegawai dimuat langsung dari spreadsheet.`);
      } catch (err) {
